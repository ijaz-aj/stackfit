# SIEM / log management.
#
# Prices are in minor units (CONTRIBUTING.md hard rule 1): `amountMinor: 5900` with
# `currency: USD` is USD 59.00. No float ever enters the repo.
#
# opsBurden and implementation figures are analyst estimates, not vendor
# claims. They are the most opinionated numbers in this file and the ones most
# worth arguing about. They are also what stops "Wazuh is free" from being the
# answer to every question (hard rule 8).

category: siem

products:
  - id: wazuh
    name: Wazuh
    vendor: Wazuh, Inc.
    category: siem
    subcategory: open-source SIEM + XDR platform
    licenceModel: open_source
    maturity: established

    tiers:
      - id: open
        name: Wazuh (self-managed)
        capabilities:
          - Log collection and correlation
          - File integrity monitoring
          - Security configuration assessment
          - Vulnerability detection from package inventory
          - Agent-based endpoint telemetry
        pricing:
          - model: zero_licence
            pricingConfidence: public_list
            refresh:
              method: manual
              checkUrl: https://wazuh.com/pricing/
              note: Confirm the core platform is still GPLv2 and unmetered, and check what Wazuh Cloud now costs as the managed alternative.
            sources:
              - url: https://github.com/wazuh/wazuh/blob/main/LICENSE
                asOf: '2026-09-09'
              - url: https://wazuh.com/
                asOf: '2026-09-09'
            notes: GPLv2. No licence fee at any scale; cost is entirely people and infrastructure.

    supports:
      os: [windows, linux, macos]
      deviceClasses:
        - server
        - workstation
        - domain_controller
        - hypervisor
        - container_node
        - cloud_workload
      cloudPlatforms: [aws, azure, gcp]
      deploymentModes: [on_prem, hybrid, cloud, air_gapped]
      scaleFloor: small
      scaleCeiling: large
      airGapCapable: true

    integrations: [syslog, opensearch, suricata, misp, virustotal, thehive]

    controlsCovered:
      # cis-v8:1 (Inventory and Control of Enterprise Assets) was claimed here
      # and is not: Wazuh's syscollector inventories hosts that already run an
      # agent, and Control 1 is about finding the ones that do not.
      # cis-v8:4 is kept and is deliberately outside that control's own
      # satisfiedBy list. The Security Configuration Assessment module really
      # does run CIS benchmark checks, which most SIEMs do not, so this is a
      # product-level exception rather than a reason to widen the category.
      - cis-v8:4
      - cis-v8:8
      - cis-v8:13
      - nist-csf-2.0:DE.CM
      - nist-csf-2.0:DE.AE
      - nist-csf-2.0:RS.AN
      - pci-dss-4.0:10
      - pci-dss-4.0:11

    opsBurden:
      baseFte: 0.5
      ftePerThousandAssets: 0.3
      confidence: analyst_estimate
    implementation:
      effortDays: 20
      skillLevel: security_engineer
      typicalWeeks: 8
      confidence: analyst_estimate

    strengths:
      - Genuinely no licence ceiling, so ingest growth does not create a budget cliff
      - FIM and configuration assessment built in, which covers PCI DSS 11.5 without a second tool
      - Runs fully air-gapped
    weaknesses:
      - Correlation content is basic next to a commercial SIEM; detection engineering is on you
      - Cluster and index tuning is a standing operational job, not a one-off
      - Community support only unless a support contract is bought separately
    bestFor:
      - Teams with at least one engineer who can own the platform
      - Air-gapped or data-residency-constrained environments
      - PCI DSS scopes needing log retention and FIM on a tight budget
    avoidWhen:
      - Security staffing is at or near zero FTE
      - The client expects vendor-supplied detections to work on day one

    sources:
      - url: https://documentation.wazuh.com/current/getting-started/index.html
        asOf: '2026-09-09'
    notes: >-
      opsBurden and implementation are analyst estimates for a self-managed
      single-node-to-small-cluster deployment, not vendor figures.

  - id: graylog-open
    name: Graylog Open
    vendor: Graylog, Inc.
    category: siem
    subcategory: open-core log management
    licenceModel: open_core
    maturity: established

    tiers:
      - id: open
        name: Graylog Open
        capabilities:
          - Centralised log ingestion, parsing and search
          - Stream routing and alerting
          - Dashboards and saved searches
        pricing:
          - model: zero_licence
            pricingConfidence: public_list
            refresh:
              method: manual
              checkUrl: https://graylog.org/products/open/
              note: Watch for features moving from Open into the paid tiers. That is how open-core pricing actually changes.
            sources:
              - url: https://graylog.org/products/open/
                asOf: '2026-09-09'
            notes: >-
              SSPL, free of charge with no per-user fee and no ingestion cap.
              SSPL is not an OSI-approved licence, hence licenceModel open_core.

      - id: enterprise
        name: Graylog Enterprise
        capabilities:
          - Everything in Graylog Open
          - Data routing, archiving and tiered storage
          - Audit log and role-based access control
          - Report scheduling
          - Vendor support
        pricing:
          - model: flat_tiered
            tiers:
              - minUnits: 0
                maxUnits: null
                flatPrice:
                  amountMinor: 1500000
                  currency: USD
            termYears: 1
            pricingConfidence: public_list
            refresh:
              method: manual
              checkUrl: https://graylog.org/pricing/
              note: >-
                Graylog publishes a starting price rather than a rate. Read the
                "starting at" figure and the minimum entry point together. The
                floor is what this models, and the rate above it is quote-only.
            sources:
              - url: https://graylog.org/pricing/
                asOf: '2026-09-12'
            notes: >-
              Graylog publishes "Starting at $15,000/year", with a minimum entry
              of 10 GB/day of processed volume or 100 Graylog Consumption Units
              on annual consumption.

              ⚠ THIS IS A FLOOR, NOT A RATE. Graylog licenses processed data
              volume in the active tier, and the per-GB figure above the minimum
              is quote-only. A client ingesting 100 GB/day will pay
              considerably more than USD 15,000, and this entry has no way to
              say how much more. Treat it as "the cheapest this can be" and get
              a quote.

      - id: security
        name: Graylog Security
        capabilities:
          - Everything in Graylog Enterprise
          - Security-specific detection content and anomaly detection
          - Investigation and case workflow
          - Compliance reporting and dashboards
          - SOAR-style response integrations
        pricing:
          - model: flat_tiered
            tiers:
              - minUnits: 0
                maxUnits: null
                flatPrice:
                  amountMinor: 1800000
                  currency: USD
            termYears: 1
            pricingConfidence: public_list
            refresh:
              method: manual
              checkUrl: https://graylog.org/pricing/
              note: Read the "starting at" figure and the minimum entry point together.
            sources:
              - url: https://graylog.org/pricing/
                asOf: '2026-09-12'
            notes: >-
              Graylog publishes "Starting at $18,000/year", on the same 10 GB/day
              minimum entry point. Same caveat as the Enterprise tier: a floor,
              not a rate.
        controlsCovered:
          - cis-v8:17
          - nist-csf-2.0:DE.AE
          - nist-csf-2.0:RS.AN
          - nist-csf-2.0:RS.MA
          - iso-27001-2022:A.5.25
          - iso-27001-2022:A.8.16
          - soc-2:CC7
          - rbi-csf:incident-response

    supports:
      os: [windows, linux, macos, network_os]
      deviceClasses:
        - server
        - workstation
        - network_device
        - firewall
        - container_node
        - cloud_workload
      cloudPlatforms: [aws, azure, gcp]
      deploymentModes: [on_prem, hybrid, air_gapped]
      scaleFloor: small
      scaleCeiling: large
      airGapCapable: true

    integrations: [syslog, cef, opensearch, otel]

    controlsCovered:
      - cis-v8:8
      - nist-csf-2.0:DE.CM
      - nist-csf-2.0:DE.AE
      - pci-dss-4.0:10

    opsBurden:
      baseFte: 0.4
      ftePerThousandAssets: 0.25
      confidence: analyst_estimate
    implementation:
      effortDays: 12
      skillLevel: security_engineer
      typicalWeeks: 5
      confidence: analyst_estimate

    strengths:
      - Strong log parsing and search ergonomics for the price
      - Simpler to operate than a full Elastic stack
    weaknesses:
      - Log management, not detection. No agent, no FIM, no bundled detection content
      - 'Deliberately gated: FIM, correlation and compliance reporting sit in the paid tiers'
    bestFor:
      - Clients whose immediate obligation is log centralisation and retention
      - Environments that already have EDR and need somewhere to send everything else
    avoidWhen:
      - The client needs FIM or configuration assessment from the same tool
      - Detection content is expected out of the box

    sources:
      - url: https://graylog.org/products/open/
        asOf: '2026-09-09'
    notes: >-
      Graylog Security and Enterprise are now catalogued, as the Phase 1 note
      said they would be. Both publish a starting price and neither publishes a
      rate: Graylog licenses processed data volume in the active tier, with a
      minimum entry of 10 GB/day, and the figure above that minimum is
      quote-only. The two paid tiers are therefore modelled as floors and will
      understate any real ingest volume, which is the wrong direction, so get
      a quote before either number reaches a client.

      Open remains genuinely free with no ingestion cap. The upgrade decision is
      almost never about ingest and almost always about archiving, audit logging
      and, for Security, the detection content, which is the only thing in
      this product that a SIEM buyer is really paying for.

  - id: microsoft-sentinel
    name: Microsoft Sentinel
    vendor: Microsoft
    category: siem
    subcategory: cloud-native SIEM
    licenceModel: commercial
    maturity: established

    tiers:
      - id: pay-as-you-go
        name: Pay-as-you-go (Analytics Logs)
        capabilities:
          - Cloud-native log ingestion and analytics
          - Built-in analytics rules and UEBA
          - Native Microsoft 365 and Entra ID connectors
          - Playbook automation via Logic Apps
        pricing:
          - model: consumption
            consumptionUnit: GB ingested into Analytics logs
            unitPrice:
              amountMinor: 430
              currency: USD
            pricingConfidence: public_list
            refresh:
              method: azure_retail_prices
              meterId: 05d96412-9ca4-5926-b2a0-c646f72b2c2c
              armRegionName: eastus
              expectedUnitOfMeasure: 1 GB
            sources:
              - url: https://prices.azure.com/api/retail/prices?$filter=serviceName%20eq%20%27Sentinel%27%20and%20armRegionName%20eq%20%27eastus%27
                asOf: '2026-09-09'
              - url: https://learn.microsoft.com/en-us/azure/sentinel/billing
                asOf: '2026-09-09'
            notes: >-
              USD 4.30 per GB, the "Pay-as-you-go Analysis" meter for East US,
              read from the Azure Retail Prices API: Microsoft's own
              authoritative price feed. The Sentinel pricing page and the
              learn.microsoft.com billing article both decline to quote a
              figure, so the API is the primary source.

              Two things this rate does NOT capture, both of which move a real
              bill a long way. Confirm both before quoting.
              (1) Region. East US is at the cheap end; other regions run higher,
              so re-read the API with the client's own armRegionName.
              (2) Commitment tiers. From 100 GB/day the simplified commitment
              meters are roughly 30% below pay-as-you-go (100 GB/day was
              USD 296.00/day, i.e. USD 2.96/GB, in the same API response). Any
              client ingesting over 100 GB/day should be costed on a commitment
              tier, not on this rate.

    supports:
      os: [windows, linux, macos]
      deviceClasses:
        - server
        - workstation
        - domain_controller
        - cloud_workload
        - saas_tenant
        - identity
      cloudPlatforms: [azure, aws, gcp, m365]
      deploymentModes: [cloud]
      scaleFloor: mid
      scaleCeiling: enterprise
      airGapCapable: false

    integrations: [syslog, cef, otel, microsoft-defender-for-endpoint]

    controlsCovered:
      - cis-v8:8
      - cis-v8:13
      - cis-v8:17
      - nist-csf-2.0:DE.CM
      - nist-csf-2.0:DE.AE
      - nist-csf-2.0:RS.AN
      - nist-csf-2.0:RS.MA
      - pci-dss-4.0:10

    opsBurden:
      baseFte: 0.3
      ftePerThousandAssets: 0.2
      confidence: analyst_estimate
    implementation:
      effortDays: 15
      skillLevel: security_engineer
      typicalWeeks: 6
      confidence: analyst_estimate

    strengths:
      - No platform to run; ingest scales without a capacity project
      - Best-in-class coverage of Microsoft 365 and Entra ID estates
      - Detection content and playbooks ship with the product
    weaknesses:
      - Consumption pricing makes cost a function of log volume, which clients underestimate
      - SaaS-only, so it is eliminated outright in air-gapped scopes
      - Cost control becomes its own engineering task at scale
    bestFor:
      - Microsoft-heavy estates already paying for Entra ID and Microsoft 365
      - Teams that want detection content without staffing detection engineering
    avoidWhen:
      - The environment is air-gapped or has data-residency constraints Azure cannot meet
      - Log volume is high and the budget is fixed

    sources:
      - url: https://learn.microsoft.com/en-us/azure/sentinel/overview
        asOf: '2026-09-09'
      - url: https://learn.microsoft.com/en-us/azure/sentinel/billing
        asOf: '2026-09-09'
    notes: >-
      Microsoft Sentinel moves to the Microsoft Defender portal only after
      31 March 2027; the Azure portal experience is being retired. Worth raising
      on any engagement whose horizon crosses that date.

      Sizing note that materially changes the cost: Microsoft Defender XDR
      alerts, Microsoft 365 audit logs (SharePoint, Exchange, Teams) and Azure
      Activity logs ingest free. For a Microsoft-heavy client a large slice of
      the estimated GB/day may be free, so Sentinel can come out cheaper than a
      naive per-GB calculation suggests.

  - id: opensearch
    name: OpenSearch with Security Analytics
    vendor: OpenSearch Software Foundation (Linux Foundation)
    category: siem
    subcategory: Apache-licensed search platform with a threat-detection plugin
    licenceModel: open_source
    maturity: established

    tiers:
      - id: open
        name: OpenSearch (self-hosted)
        capabilities:
          - Log ingestion, indexing and search at scale
          - Security Analytics threat-detection engine with pre-loaded detection rules
          - Rules that can be customised and extended for custom attack patterns
          - Event correlation across log sources
          - Alerting and notification on findings
          - Security analytics dashboards
        pricing:
          - model: zero_licence
            pricingConfidence: public_list
            refresh:
              method: manual
              checkUrl: https://github.com/opensearch-project/OpenSearch
              note: >-
                Apache 2.0 under the Linux Foundation, which makes a licence
                change about as unlikely as it gets in this catalog: OpenSearch
                exists precisely because Elasticsearch's licence changed. Worth
                re-checking the Security Analytics plugin's release cadence
                rather than the licence.
            sources:
              - url: https://github.com/opensearch-project/OpenSearch
                asOf: '2026-09-12'
              - url: https://github.com/opensearch-project/security-analytics
                asOf: '2026-09-12'
            notes: >-
              Apache License 2.0, for both the platform and the Security
              Analytics plugin. OpenSearch is a registered trademark of LF
              Projects, LLC. No licence fee, no ingest cap, no per-user charge.
              The cost is entirely the cluster and the engineer who runs it.

              AWS sells a managed OpenSearch Service; that is a different
              purchase, priced per instance-hour, and is not catalogued.

    supports:
      os: [linux, windows]
      deviceClasses:
        - server
        - workstation
        - domain_controller
        - network_device
        - firewall
        - container_node
        - cloud_workload
      cloudPlatforms: [aws, azure, gcp]
      deploymentModes: [on_prem, hybrid, cloud, air_gapped]
      scaleFloor: mid
      scaleCeiling: enterprise
      airGapCapable: true

    integrations: [syslog, cef, otel, wazuh, arkime, zeek, suricata]

    controlsCovered:
      # Claims detection, not response. Security Analytics raises findings and
      # alerts; acting on them is a SOAR or an analyst, and crediting it with
      # incident management would overstate what shipping the plugin buys.
      - cis-v8:8
      - cis-v8:13
      - nist-csf-2.0:DE.CM
      - nist-csf-2.0:DE.AE
      - iso-27001-2022:A.8.15
      - iso-27001-2022:A.8.16
      - pci-dss-4.0:10
      - hipaa:164.312.b
      - soc-2:CC7
      - rbi-csf:audit-logs
      - dpdp-2023:rule-6-logging
      - cert-in:logs-180-days-in-india

    opsBurden:
      baseFte: 0.5
      ftePerThousandAssets: 0.25
      confidence: analyst_estimate
    implementation:
      effortDays: 18
      skillLevel: security_engineer
      typicalWeeks: 8
      confidence: analyst_estimate

    strengths:
      - Genuinely Apache 2.0 under the Linux Foundation, with no licence cliff ahead of it
      - No ingest licensing at all, so log volume growth is an infrastructure decision rather than a commercial one
      - Runs fully air-gapped and is already the storage layer under Arkime and several other tools here
    weaknesses:
      - 'You are running a distributed search cluster: index lifecycle, shard sizing and capacity are now standing jobs'
      - Detection content is thinner than a commercial SIEM's and thinner than Elastic's
      - No case management and no response actions of its own
    bestFor:
      - Clients with a platform team who want a SIEM with no licence ceiling
      - Estates already running OpenSearch for observability
      - Air-gapped or data-residency-constrained environments
    avoidWhen:
      - Security staffing is thin. This is a platform to operate, not a product to buy
      - The client expects vendor-supplied detections to work on day one

    sources:
      - url: https://github.com/opensearch-project/OpenSearch
        asOf: '2026-09-12'
      - url: https://github.com/opensearch-project/security-analytics
        asOf: '2026-09-12'
    notes: >-
      The highest baseFte in the siem file, deliberately. OpenSearch will do
      what Wazuh and Graylog do and more, and it asks for a cluster operator to
      do it. scaleFloor is "mid" for the same reason: below that size this is a
      project rather than a control.

      ⚠ Security Analytics' documentation did not state Sigma rule support or
      threat-intelligence feed support on the page read, so neither is claimed
      here. Check both before promising them.

  - id: elastic-security
    name: Elastic Security
    vendor: Elastic
    category: siem
    subcategory: SIEM and endpoint on the Elastic Stack
    licenceModel: open_core
    maturity: established

    tiers:
      - id: basic-self-managed
        name: Basic (self-managed)
        capabilities:
          - Centralised ingestion, analysis and management of security data
          - Prebuilt and customisable detection rules that alert when events match
          - The Security app interface and Kibana dashboards
          - Timeline for investigating events and alerts
        pricing:
          - model: zero_licence
            pricingConfidence: public_list
            refresh:
              method: manual
              checkUrl: https://www.elastic.co/subscriptions
              note: >-
                ⚠ READ THE SUBSCRIPTIONS PAGE FIRST, not the licence. The
                licensing is settled; the Basic-versus-paid split is the thing
                that moves, it decides whether this tier is worth anything at
                zero, and Elastic's own page does not state it plainly. See the
                product notes.
            sources:
              - url: https://github.com/elastic/elasticsearch/blob/main/LICENSE.txt
                asOf: '2026-09-12'
              - url: https://www.elastic.co/guide/en/security/current/es-overview.html
                asOf: '2026-09-12'
            notes: >-
              Elasticsearch source is triple-licensed: AGPLv3, Server Side
              Public License v1, or Elastic License 2.0: except the x-pack
              folder, which is Elastic License 2.0 only. The Security solution
              lives largely in x-pack, so ELv2 is the licence that governs it:
              source-available, free to self-manage, and forbidding provision to
              third parties as a managed service. That distinction matters to an
              MSP and not to an end client.

              Elastic Cloud and the paid subscription tiers are consumption- and
              tier-priced and are not catalogued.

    supports:
      os: [windows, linux, macos]
      deviceClasses:
        - server
        - workstation
        - domain_controller
        - network_device
        - firewall
        - container_node
        - cloud_workload
        - saas_tenant
      cloudPlatforms: [aws, azure, gcp, m365]
      deploymentModes: [on_prem, hybrid, cloud, air_gapped]
      scaleFloor: mid
      scaleCeiling: enterprise
      airGapCapable: true

    integrations: [syslog, cef, otel, zeek, suricata, elasticsearch]

    controlsCovered:
      # Narrowed to what the free tier actually ships. Detection rules and the
      # Security app are in Basic, so logging, monitoring and adverse-event
      # analysis hold. Case management and Elastic Defend are not, so the
      # incident-response controls that lean on them: CSF RS.AN, ISO A.5.25
      # and rbi-csf:incident-response: are deliberately absent. They were
      # claimed here until the tier split was checked.
      - cis-v8:8
      - cis-v8:13
      - nist-csf-2.0:DE.CM
      - nist-csf-2.0:DE.AE
      - iso-27001-2022:A.8.15
      - iso-27001-2022:A.8.16
      - pci-dss-4.0:10
      - hipaa:164.312.b
      - soc-2:CC7
      - rbi-csf:audit-logs
      - dpdp-2023:rule-6-logging

    opsBurden:
      baseFte: 0.45
      ftePerThousandAssets: 0.25
      confidence: analyst_estimate
    implementation:
      effortDays: 18
      skillLevel: security_engineer
      typicalWeeks: 8
      confidence: analyst_estimate

    strengths:
      - Prebuilt detection rules in the free tier, maintained by Elastic. The strongest free detection content here
      - SIEM and endpoint in one platform if the client pays for it, with nothing to build between them
      - Self-managed and air-gappable, which the commercial SaaS SIEMs are not
    weaknesses:
      - 'Elastic License 2.0, not open source: an MSP cannot run it as a service for clients'
      - Operating an Elastic cluster at security log volumes is a standing engineering job
      - 'The free tier stops short of the things a SOC needs: no endpoint agent, no case management, no machine-learning detections'
    bestFor:
      - Clients who want commercial-grade detection content without a per-GB SIEM bill
      - Estates already running Elastic for observability
    avoidWhen:
      - The client is an MSP intending to run it on behalf of others
      - There is no engineer who will own the cluster

    sources:
      - url: https://www.elastic.co/guide/en/security/current/es-overview.html
        asOf: '2026-09-12'
      - url: https://github.com/elastic/elasticsearch/blob/main/LICENSE.txt
        asOf: '2026-09-12'
    notes: >-
      ⚠ THE TIER SPLIT IS CORROBORATED, NOT VENDOR-STATED. Elastic's own
      subscriptions page does not set out plainly which Security capabilities
      sit in Basic, and its docs describe permissions rather than tiers.
      Independent sources agree on the shape: Basic carries log ingestion,
      Kibana dashboards, the Security app and prebuilt detection rules;
      machine-learning anomaly detection needs Platinum; Elastic Defend and case
      management need a paid tier.

      This entry was corrected once already on the strength of that. It
      originally listed Elastic Defend and case management as Basic capabilities
      and claimed the incident-response controls that lean on them, which would
      have offered a client endpoint protection and a case workflow at zero
      cost, and credited them with response capability they had not bought.

      Confirm the split with Elastic before this reaches a proposal. The number
      that matters is not the licence, which is settled, but where the line
      falls, and it is where all the value is.
