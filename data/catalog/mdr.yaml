                asOf: '2026-09-12'
              - url: https://mdrcost.com/sophos-mdr-pricing
                asOf: '2026-09-12'
            notes: >-
              ⚠ NOT VENDOR-PUBLISHED. USD 25 per endpoint per month, so USD 300
