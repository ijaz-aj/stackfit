          - iso-27001-2022:A.5.27

    supports:
      os: [windows, macos, linux]
      deviceClasses: [workstation, server, cloud_workload, firewall, identity, saas_tenant]
      cloudPlatforms: [aws, azure, gcp, m365]
      deploymentModes: [cloud, hybrid]
      scaleFloor: small
      scaleCeiling: enterprise
      airGapCapable: false

    integrations: [microsoft-entra-id, m365, syslog, microsoft-defender-for-endpoint]

    controlsCovered:
      - cis-v8:10
      - cis-v8:13
      - cis-v8:17
      - nist-csf-2.0:DE.CM
      - nist-csf-2.0:DE.AE
      - nist-csf-2.0:RS.AN
      - nist-csf-2.0:RS.MA
      - nist-csf-2.0:RS.MI
      - iso-27001-2022:A.5.24
      - iso-27001-2022:A.5.25
      - iso-27001-2022:A.5.26
      - iso-27001-2022:A.8.7
      - iso-27001-2022:A.8.16
      - pci-dss-4.0:5
      - soc-2:CC7
      - nis2:21.2.b
      - rbi-csf:incident-response
      - rbi-csf:soc

    opsBurden:
      baseFte: 0.1
      ftePerThousandAssets: 0.03
      confidence: analyst_estimate
    implementation:
      effortDays: 5
      skillLevel: generalist
      typicalWeeks: 3
      confidence: analyst_estimate

    strengths:
      - Takes response actions on the client's behalf rather than escalating and waiting
      - Ingests telemetry from third-party tools, so it does not require a full Sophos estate
      - The Complete tier's uncapped incident response is a genuine risk transfer
    weaknesses:
      - 'No published price at all: both tiers here are benchmarks, not quotes'
      - Partner-led sales means the price depends on which partner is asked
      - SaaS-only
    bestFor:
      - Clients with no security staff who need someone empowered to act, not just alert
      - Estates already running Sophos endpoint or firewall
    avoidWhen:
      - Budget certainty matters and a partner quote cannot be obtained in time
      - The environment is air-gapped

    sources:
      - url: https://www.sophos.com/en-us/products/managed-detection-and-response
        asOf: '2026-09-12'
    notes: >-
      Both tiers carry analyst-estimated pricing and will show a confidence
      warning wherever they are costed. The warning is correct. Treat these
      figures as a budget placeholder pending a partner quote.

