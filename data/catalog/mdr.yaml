# MDR: managed detection and response, bought as a service.
#
# Prices are in minor units (hard rule 1).
#
# ⚠ TWO OF FIVE PUBLISH A PRICE. Huntress and Blumira do. Sophos MDR, Arctic
# Wolf, Rapid7 MDR, Expel, Red Canary, eSentire, Microsoft Defender Experts for
# XDR and CrowdStrike Falcon Complete were all checked on 2026-09-12 and every
# one answers "contact sales". The three entries below on analyst-estimated
# pricing are flagged as such and will show a confidence warning wherever they
# are costed.
#
# That ratio is the finding. MDR is the category a client with no security
# staff most needs and the one where a defensible budget number is hardest to
# obtain, which is exactly why the SMB-focused vendors who do publish have an
# advantage worth naming on the call.
#
# ⚠ RELATIONSHIP TO THE MSSP RATE CARD. data/config/mssp-rate-card.yaml models
# the generic "buy it as a service instead" alternative that every bundle
# carries. This file is different: these are named products the portfolio can
# select into a bundle like any other. A scenario can end up with both. An
# MDR product in the stack and an MSSP alternative quoted beside it, and that
# is correct, because they answer different questions.
#
# ⚠ OPS BURDEN IS NOT ZERO. Buying MDR does not remove the client's side of the
# work: someone still has to action what the provider escalates, own the
# endpoints the agent runs on, and maintain the relationship. The baseFte
# figures below are deliberately non-zero for that reason, and they are the
# numbers most worth arguing with in this file.

category: mdr

products:
  - id: huntress
    name: Huntress
    vendor: Huntress Labs
    category: mdr
    subcategory: SMB-focused managed detection with a 24/7 SOC
    licenceModel: managed_service
    maturity: established

    tiers:
      - id: managed-edr
        name: Managed EDR
        capabilities:
          - 24/7 human SOC triage included at no extra charge
          - Managed endpoint detection and response
          - Persistent foothold and ransomware detection
          - Guided remediation with written incident reports
          - Host isolation
        pricing:
          - model: per_endpoint_year
            unitPrice:
              amountMinor: 9588
              currency: USD
            termYears: 1
            pricingConfidence: public_list
            refresh:
              method: manual
              checkUrl: https://www.huntress.com/pricing
              note: >-
                Read the per-endpoint-per-month figure and multiply by 12.
                Huntress quotes an example at 100 units and states that the
                per-unit cost falls at higher volumes, so re-check the volume
                the example is anchored on as well as the rate.
            sources:
              - url: https://www.huntress.com/pricing
                asOf: '2026-09-12'
            notes: >-
              USD 7.99 per endpoint per month at the published 100-endpoint
              example, so USD 95.88 per endpoint per year. Huntress states the
              per-unit cost decreases at higher volumes, so this rate overstates
              for a large estate. The safe direction for a budget estimate,
              but say so.

      - id: managed-itdr
        name: Managed ITDR
        capabilities:
          - Managed identity threat detection for Microsoft 365 and Entra ID
          - Session hijacking and business email compromise detection
          - Automated malicious-session termination
          - 24/7 SOC triage
        pricing:
          - model: per_user_year
            unitPrice:
              amountMinor: 4320
              currency: USD
            termYears: 1
            pricingConfidence: public_list
            refresh:
              method: manual
              checkUrl: https://www.huntress.com/pricing
              note: Read the per-identity-per-month figure and multiply by 12.
            sources:
              - url: https://www.huntress.com/pricing
                asOf: '2026-09-12'
            notes: >-
              USD 3.60 per licensed identity per month at the published
              100-identity example, so USD 43.20 per identity per year. Billed
              here against headcount, which is the closest available proxy for
              licensed identities.
        controlsCovered:
          - cis-v8:6
          - nist-csf-2.0:PR.AA
          - iso-27001-2022:A.5.16
          - iso-27001-2022:A.8.16

    supports:
      os: [windows, macos, linux]
      deviceClasses: [workstation, server, identity, saas_tenant]
      cloudPlatforms: [m365]
      deploymentModes: [cloud]
      scaleFloor: small
      scaleCeiling: mid
      airGapCapable: false

    integrations: [microsoft-entra-id, m365, syslog]

    controlsCovered:
      - cis-v8:10
      - cis-v8:17
      - nist-csf-2.0:DE.CM
      - nist-csf-2.0:DE.AE
      - nist-csf-2.0:RS.AN
      - nist-csf-2.0:RS.MA
      - nist-csf-2.0:RS.MI
      - iso-27001-2022:A.5.24
      - iso-27001-2022:A.5.25
      - iso-27001-2022:A.5.26
      - iso-27001-2022:A.8.7
      - iso-27001-2022:A.8.16
      - pci-dss-4.0:5
      - soc-2:CC7
      - nis2:21.2.b
      - rbi-csf:incident-response
      - rbi-csf:soc

    opsBurden:
      baseFte: 0.1
      ftePerThousandAssets: 0.05
      confidence: analyst_estimate
    implementation:
      effortDays: 3
      skillLevel: generalist
      typicalWeeks: 2
      confidence: analyst_estimate

    strengths:
      - Publishes a price, which two thirds of this category refuses to do
      - The SOC is included rather than an upsell, so the quoted rate is close to the real one
      - 'Lowest barrier in the category: deployable by an IT generalist in days'
    weaknesses:
      - Deliberately narrower than a full XDR. It does a few things well rather than everything
      - Aimed at SMB and lower mid-market; large estates outgrow the model
      - SaaS-only, with no air-gapped option
    bestFor:
      - Clients with zero or near-zero security staff, which is the §12.2 scenario exactly
      - Estates under a few thousand endpoints wanting 24/7 cover without building a SOC
    avoidWhen:
      - The environment is air-gapped
      - The client needs coverage across network, OT and bespoke applications

    sources:
      - url: https://www.huntress.com/pricing
        asOf: '2026-09-12'
    notes: >-
      Managed SIEM (USD 3.50 per source per month) and Managed Security
      Awareness Training (USD 1.75 per learner per month) are also published and
      are not catalogued as tiers: "per source" and "per learner" are billable
      units the cost engine has no sizing figure for. Quote them by hand.

  - id: blumira
    name: Blumira
    vendor: Blumira
    category: mdr
    subcategory: detection and response platform with SOC support
    licenceModel: managed_service
    maturity: established

    tiers:
      - id: detect
        name: Detect
        capabilities:
          - Log collection and managed detection across cloud and on-premises sources
          - Prioritised findings with written response playbooks
          - One year of log retention
          - Security operations support
        pricing:
          - model: per_user_year
            unitPrice:
              amountMinor: 14400
              currency: USD
            termYears: 1
            pricingConfidence: public_list
            refresh:
              method: manual
              checkUrl: https://www.blumira.com/pricing
              note: >-
                Read the per-employee-per-month figure and multiply by 12. Also
                re-read Blumira's definition of "employee". It counts knowledge
                workers with a corporate email address and a device, not total
                headcount, and that definition is what decides the bill.
            sources:
              - url: https://www.blumira.com/pricing
                asOf: '2026-09-12'
            notes: >-
              USD 12 per employee per month, so USD 144 per employee per year,
              on an annual contract. A one-time onboarding fee of USD 500
              applies to this edition and is not modelled. The cost engine's
              one-off line is implementation services, and a vendor onboarding
              fee is neither that nor a licence.

      - id: respond
        name: Respond
        capabilities:
          - Everything in Detect
          - 24/7 SecOps support with an urgent-priority phone line
          - Automated host isolation
          - Threat hunting
        pricing:
          - model: per_user_year
            unitPrice:
              amountMinor: 19200
              currency: USD
            termYears: 1
            pricingConfidence: public_list
            refresh:
              method: manual
              checkUrl: https://www.blumira.com/pricing
              note: Read the per-employee-per-month figure and multiply by 12.
            sources:
              - url: https://www.blumira.com/pricing
                asOf: '2026-09-12'
            notes: >-
              USD 16 per employee per month, so USD 192 per employee per year.
              A one-time onboarding fee of USD 250 applies and is not modelled.
        controlsCovered:
          - nist-csf-2.0:RS.MI
          - iso-27001-2022:A.5.26

      - id: automate
        name: Automate
        capabilities:
          - Everything in Respond
          - Automated response workflows
          - Extended retention
          - Onboarding included
        pricing:
          - model: per_user_year
            unitPrice:
              amountMinor: 25200
              currency: USD
            termYears: 1
            pricingConfidence: public_list
            refresh:
              method: manual
              checkUrl: https://www.blumira.com/pricing
              note: Read the per-employee-per-month figure and multiply by 12.
            sources:
              - url: https://www.blumira.com/pricing
                asOf: '2026-09-12'
            notes: >-
              USD 21 per employee per month, so USD 252 per employee per year.
              Onboarding is included at this edition.
        controlsCovered:
          - nist-csf-2.0:RS.MI
          - nist-csf-2.0:RS.CO
          - iso-27001-2022:A.5.26
          - cis-v8:17

    supports:
      os: [windows, macos, linux]
      deviceClasses: [workstation, server, identity, saas_tenant, cloud_workload, firewall]
      cloudPlatforms: [aws, azure, gcp, m365, google_workspace]
      deploymentModes: [cloud, hybrid]
      scaleFloor: small
      scaleCeiling: mid
      airGapCapable: false

    integrations: [microsoft-entra-id, m365, syslog, opnsense, pfsense, crowdstrike-falcon-go]

    controlsCovered:
      - cis-v8:8
      - cis-v8:13
      - nist-csf-2.0:DE.CM
      - nist-csf-2.0:DE.AE
      - nist-csf-2.0:RS.AN
      - nist-csf-2.0:RS.MA
      - iso-27001-2022:A.5.24
      - iso-27001-2022:A.5.25
      - iso-27001-2022:A.8.15
      - iso-27001-2022:A.8.16
      - pci-dss-4.0:10
      - soc-2:CC7
      - nis2:21.2.b
      - rbi-csf:incident-response
      - rbi-csf:soc
      - rbi-csf:audit-logs

    opsBurden:
      baseFte: 0.15
      ftePerThousandAssets: 0.05
      confidence: analyst_estimate
    implementation:
      effortDays: 5
      skillLevel: generalist
      typicalWeeks: 3
      confidence: analyst_estimate

    strengths:
      - Covers the log-management obligation and the detection obligation in one subscription
      - Priced per employee rather than per endpoint, which suits an estate with more devices than people
      - Published price list including the onboarding fees, which is unusually candid
    weaknesses:
      - Per-employee pricing punishes a people-heavy, device-light client
      - Narrower detection content than the large MDR providers
      - SaaS-only
    bestFor:
      - Clients who need both a SIEM obligation met and someone watching it
      - Small teams with a compliance-driven log retention requirement
    avoidWhen:
      - The environment is air-gapped
      - Headcount is large relative to the estate being protected

    sources:
      - url: https://www.blumira.com/pricing
        asOf: '2026-09-12'
    notes: >-
      Blumira's one-time onboarding fees (USD 500 for Detect, USD 250 for
      Respond, included for Automate) are published and deliberately not
      modelled. The cost engine's only one-off lines are implementation services
      and training, and a vendor onboarding fee is neither. Add it by hand.
      It changes the year-one figure and nothing else.

