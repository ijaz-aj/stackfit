            notes: USD 9.00 per user per month, so USD 108.00 per user per year.
        controlsCovered:
          - iso-27001-2022:A.5.15
          - iso-27001-2022:A.8.3
          - iso-27001-2022:A.6.7
          - pci-dss-4.0:7

    supports:
      os: [windows, linux, macos, ios, android]
      deviceClasses: [identity, workstation, server, saas_tenant, web_app]
      cloudPlatforms: [aws, azure, gcp, m365, google_workspace]
      deploymentModes: [cloud, hybrid]
      scaleFloor: small
      scaleCeiling: enterprise
      airGapCapable: false

    integrations: [saml, oidc, radius, ldap]

    controlsCovered:
      # Duo authenticates people and gates access. It does not manage accounts,
      # so cis-v8:5 (Account Management) is deliberately absent — the directory
      # it sits in front of is what closes that control.
      - cis-v8:6
      - nist-csf-2.0:PR.AA
      - iso-27001-2022:A.5.17
      - iso-27001-2022:A.8.5
      - pci-dss-4.0:8
      - hipaa:164.312.d
      - soc-2:CC6
      - nis2:21.2.j
      - rbi-csf:user-access-control
      - gdpr:art-32

    opsBurden:
      baseFte: 0.05
      ftePerThousandAssets: 0.03
      confidence: analyst_estimate
    implementation:
      effortDays: 4
      skillLevel: generalist
      typicalWeeks: 3
      confidence: analyst_estimate

    strengths:
      - The fastest route from no MFA to MFA everywhere, typically inside a fortnight
      - Sits in front of an existing directory rather than replacing it, so there is no migration
      - Covers on-premises VPN, RDP and SSH, which most cloud-native IdPs do not
    weaknesses:
      - Not a directory — it needs a source of identity to protect
      - Adds a second identity vendor to the estate and a second console to operate
      - 'Purchasing increments distort small deals: a 62-user client pays for 75'
    bestFor:
      - Clients whose immediate obligation is MFA on remote access and privileged logins
      - Estates with on-premises applications that a SaaS IdP cannot reach
    avoidWhen:
      - Conditional Access or an equivalent is already licensed and unused
      - The client needs a directory and lifecycle management, not just a second factor

    sources:
      - url: https://duo.com/pricing
        asOf: '2026-09-12'
    notes: >-
      Duo Free exists at no charge for up to 10 users. It is deliberately not
      catalogued as a tier: the schema has no way to express a headcount cap, so
      a free tier here would be offered to a 500-person client at zero cost,
      which is worse than not offering it at all. Raise it by hand for genuinely
      tiny scopes.
