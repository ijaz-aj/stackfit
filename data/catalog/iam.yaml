      - Vendor-neutral, with the largest pre-integrated application catalogue in the category
      - Lifecycle Management automates joiner-mover-leaver, which is the control auditors actually test
      - Published list pricing on the entry suites, which is rare above the SMB tier
    weaknesses:
      - Materially more expensive than bundling identity into an existing Microsoft subscription
      - 'Elapsed time is application integration, not product setup: the long pole is every app owner'
      - SaaS-only, so air-gapped scopes eliminate it
