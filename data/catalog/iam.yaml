# IAM — workforce identity, SSO and MFA.
#
# Prices are in minor units (hard rule 1). Every rate below is read from the
# vendor's own published pricing page; tiers that are quote-only are named in
# the notes rather than invented (hard rule 2).
#
# Scope note. This file is *workforce* identity: who the staff are, how they
# prove it, and what they can reach. Vaulting and session recording for
# administrators is a different purchase and lives in data/catalog/pam.yaml.
# Two products here (Okta Essentials, Entra ID P2) do sell a privileged-access
# capability inside the identity licence; where they do, the claim is made on
# that tier only.

category: iam

products:
  - id: keycloak
    name: Keycloak
    vendor: CNCF (originated at Red Hat)
    category: iam
    subcategory: self-hosted open-source identity provider
    licenceModel: open_source
    maturity: established

    tiers:
      - id: open
        name: Keycloak (self-hosted)
        capabilities:
          - OpenID Connect, OAuth 2.0 and SAML 2.0 single sign-on
          - LDAP and Active Directory user federation
          - Identity brokering to external OIDC and SAML providers
          - TOTP and WebAuthn second factors
          - Fine-grained role and group authorisation
        pricing:
          - model: zero_licence
            pricingConfidence: public_list
            refresh:
              method: manual
              checkUrl: https://github.com/keycloak/keycloak/blob/main/LICENSE.txt
              note: >-
                Confirm the licence is still Apache 2.0 and the project is still
                a CNCF project rather than a Red Hat product. The commercial
                path is Red Hat build of Keycloak, which is a support
                subscription and priced separately.
            sources:
              - url: https://github.com/keycloak/keycloak/blob/main/LICENSE.txt
                asOf: '2026-09-12'
              - url: https://www.keycloak.org/
                asOf: '2026-09-12'
            notes: >-
              Apache License 2.0. No licence fee and no per-user charge at any
              scale; the entire cost is the cluster it runs on and the engineer
              who owns it.

    supports:
      os: [linux, windows]
      deviceClasses: [identity, saas_tenant, server, web_app]
      cloudPlatforms: [aws, azure, gcp, oci]
      deploymentModes: [on_prem, hybrid, cloud, air_gapped]
      scaleFloor: small
      scaleCeiling: large
      airGapCapable: true

    integrations: [saml, oidc, oauth2, ldap, kerberos, scim]

    controlsCovered:
      - cis-v8:5
      - cis-v8:6
      - nist-csf-2.0:PR.AA
      - iso-27001-2022:A.5.15
      - iso-27001-2022:A.5.16
      - iso-27001-2022:A.5.17
      - iso-27001-2022:A.8.3
      - iso-27001-2022:A.8.5
      - pci-dss-4.0:7
      - pci-dss-4.0:8
      - hipaa:164.312.a.1
      - hipaa:164.312.d
      - soc-2:CC6
      - nis2:21.2.j
      - rbi-csf:user-access-control
      - gdpr:art-32
      - dpdp-2023:rule-6-access-control

    opsBurden:
      baseFte: 0.4
      ftePerThousandAssets: 0.1
      confidence: analyst_estimate
    implementation:
      effortDays: 15
      skillLevel: security_engineer
      typicalWeeks: 6
      confidence: analyst_estimate

    strengths:
      - No per-user licence, so identity cost does not scale with headcount
      - Runs fully air-gapped, which no SaaS IdP does
      - Standards-first — anything speaking OIDC or SAML federates without a connector catalogue
    weaknesses:
      - 'Availability is now yours: an IdP outage is a total outage, so HA and DR are mandatory, not optional'
      - Major versions move quickly and upgrades are a standing commitment
      - No pre-built SaaS app catalogue and no outbound provisioning — every integration is hand-built
    bestFor:
      - Air-gapped or data-residency-constrained environments
      - Estates with a platform team already running Kubernetes or containers
      - Customer- or partner-facing identity where per-user SaaS pricing would be ruinous
    avoidWhen:
      - Security staffing is at or near zero FTE
      - The requirement is hundreds of SaaS integrations with joiner-mover-leaver automation

    sources:
      - url: https://www.keycloak.org/
        asOf: '2026-09-12'
      - url: https://github.com/keycloak/keycloak/blob/main/LICENSE.txt
        asOf: '2026-09-12'
    notes: >-
      opsBurden and implementation are analyst estimates for a self-managed HA
      pair fronting an existing directory, not vendor figures. The figure most
      worth arguing with is baseFte — an IdP that nobody owns is an outage
      waiting to happen, so 0.4 is a floor rather than a midpoint.

  - id: microsoft-entra-id
    name: Microsoft Entra ID
    vendor: Microsoft
    category: iam
    subcategory: cloud identity provider for Microsoft estates
    licenceModel: commercial
    maturity: established

    tiers:
      - id: p1
        name: Entra ID P1
        capabilities:
          - Conditional Access policies
          - Self-service password reset with on-premises writeback
          - Group-based application access and dynamic group membership
          - Application Proxy for on-premises web applications
          - Cloud sync and hybrid identity to on-premises Active Directory
        pricing:
          - model: per_user_year
            unitPrice:
              amountMinor: 8400
              currency: USD
            termYears: 1
            pricingConfidence: public_list
            refresh:
              method: manual
              checkUrl: https://www.microsoft.com/en-us/security/business/microsoft-entra-pricing
              note: >-
                Read the per-user-per-month figure and multiply by 12. Check
                whether the annual-commitment qualifier still applies.
            sources:
              - url: https://www.microsoft.com/en-us/security/business/microsoft-entra-pricing
                asOf: '2026-09-12'
            notes: >-
              USD 7.00 per user per month with an annual commitment, so USD
              84.00 per user per year. Most clients will already hold this
              inside Microsoft 365 E3 or a Business Premium subscription — check
              before quoting it as a new line, because the honest answer is
              frequently that they are already paying for it.
        controlsCovered:
          - iso-27001-2022:A.5.15
          - iso-27001-2022:A.5.18
          - iso-27001-2022:A.8.3
          - pci-dss-4.0:7
          - pci-dss-4.0:8
          - hipaa:164.312.a.1
          - hipaa:164.308.a.4
          - rbi-csf:user-access-control
          - gdpr:art-32
          - dpdp-2023:rule-6-access-control

      - id: p2
        name: Entra ID P2
        capabilities:
          - Everything in P1
          - Identity Protection risk-based sign-in and user risk policies
          - Privileged Identity Management with just-in-time role elevation
          - Access reviews
          - Entitlement management
        pricing:
          - model: per_user_year
            unitPrice:
              amountMinor: 12000
              currency: USD
            termYears: 1
            pricingConfidence: public_list
            refresh:
              method: manual
              checkUrl: https://www.microsoft.com/en-us/security/business/microsoft-entra-pricing
              note: Read the per-user-per-month figure and multiply by 12.
            sources:
              - url: https://www.microsoft.com/en-us/security/business/microsoft-entra-pricing
                asOf: '2026-09-12'
            notes: >-
              USD 10.00 per user per month with an annual commitment, so USD
              120.00 per user per year. Bundled into Microsoft 365 E5.
        controlsCovered:
          - iso-27001-2022:A.5.15
          - iso-27001-2022:A.5.18
          - iso-27001-2022:A.8.2
          - iso-27001-2022:A.8.3
          - pci-dss-4.0:7
          - pci-dss-4.0:8
          - hipaa:164.312.a.1
          - hipaa:164.308.a.3
          - hipaa:164.308.a.4
          - rbi-csf:user-access-control
          - rbi-csf:privileged-access
          - nis2:21.2.i
          - gdpr:art-32
          - dpdp-2023:rule-6-access-control

    supports:
      os: [windows, linux, macos, ios, android]
      deviceClasses: [identity, saas_tenant, workstation, server, web_app]
      cloudPlatforms: [azure, m365, aws, gcp]
      deploymentModes: [cloud, hybrid]
      scaleFloor: small
      scaleCeiling: enterprise
      airGapCapable: false

    integrations: [saml, oidc, scim, ldap, microsoft-sentinel, microsoft-defender-for-endpoint]

    controlsCovered:
      # What every tier does, Free included. Conditional Access, PIM and access
      # reviews are P1/P2 capabilities and are claimed on those tiers, not here.
      - cis-v8:5
      - cis-v8:6
      - nist-csf-2.0:PR.AA
      - iso-27001-2022:A.5.16
      - iso-27001-2022:A.5.17
      - iso-27001-2022:A.8.5
      - hipaa:164.312.d
      - soc-2:CC6
      - nis2:21.2.j

    opsBurden:
      baseFte: 0.15
      ftePerThousandAssets: 0.05
      confidence: analyst_estimate
    implementation:
      effortDays: 8
      skillLevel: security_engineer
      typicalWeeks: 4
      confidence: analyst_estimate

    strengths:
      - Already present in any Microsoft 365 estate, so adoption is a licence change rather than a migration
      - Conditional Access is the single most effective identity control most clients can turn on this quarter
      - Native signal into Microsoft Sentinel and Defender with no connector to build
    weaknesses:
      - Strongest inside the Microsoft estate and merely adequate outside it
      - 'Licensing is a maze: the same capability arrives via E3, E5, Business Premium or standalone, at four different effective prices'
      - SaaS-only, so it is eliminated outright in air-gapped scopes
    bestFor:
      - Microsoft 365 estates, which is most mid-market clients
      - Hybrid estates keeping on-premises Active Directory for the foreseeable future
    avoidWhen:
      - The environment is air-gapped or has residency constraints Azure cannot meet
      - The estate is deliberately non-Microsoft, where a neutral IdP integrates better

    sources:
      - url: https://www.microsoft.com/en-us/security/business/microsoft-entra-pricing
        asOf: '2026-09-12'
      - url: https://learn.microsoft.com/en-us/entra/fundamentals/whatis
        asOf: '2026-09-12'
    notes: >-
      The number that decides this line on a real deal is almost never the
      standalone rate — it is whether the client is on Business Premium, E3 or
      E5. Business Premium and E3 include P1; E5 includes P2. Establish that
      before putting a per-user figure in a proposal.

      Entra ID Free is deliberately not catalogued as a tier, for the same
      reason Duo Free is not. Microsoft charges nothing for it, but it is not
      standalone — it exists only inside an Azure or Microsoft 365 subscription
      the client has to already hold. The catalog has no way to express that
      prerequisite, so a zero-cost tier here is offered to every client
      including those with no Microsoft estate, and it then beats every
      open-source option on cost by construction. It was catalogued briefly and
      was selected as the identity answer for an explicitly open-source-first
      client, over Keycloak, under the rationale line "No licence fee: Entra ID
      Free is commercial". A client who genuinely already holds it should list
      it in retainedTools, which is the field that models "already owned".

