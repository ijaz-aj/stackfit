      - Above 100 users Devolutions moves to a custom quote, so the published rate stops applying where it matters most
      - Windows-centric heritage; Linux and cloud-native estates are served less naturally
      - Not an enterprise PAM — no air-gapped deployment and thinner governance than the quote-only leaders
    bestFor:
      - Mid-market clients with a real privileged-access obligation and no appetite for a CyberArk conversation
      - Windows-heavy estates with a helpdesk that shares admin credentials today
    avoidWhen:
      - There are more than about a hundred privileged users
      - The environment is air-gapped

    sources:
