# PAM — privileged access, credential vaulting and session control.
#
# Prices are in minor units (hard rule 1).
#
# Scope note. Workforce identity — who the staff are and how they prove it —
# is data/catalog/iam.yaml. This file is what happens after someone has
# authenticated and needs to act as an administrator: where the credential is
# kept, who can borrow it, for how long, and whether anyone watched.
#
# ⚠ EVERY MARKET LEADER IN THIS CATEGORY IS QUOTE-ONLY. CyberArk, BeyondTrust,
# Delinea, One Identity, Wallix, StrongDM, Segura and KeeperPAM were all
# checked on 2026-09-12 and none publishes a rate. What is catalogued below is
# therefore not the top of the market — it is the part of the market that will
# tell you what it costs. Say that out loud rather than letting a shortlist
# imply the enterprise options were considered and rejected.
#
# ⚠ A BILLING-UNIT LIMITATION RUNS THROUGH THIS FILE. Three of the five
# products bill per privileged user, which `per_privileged_user_year` models
# exactly. ManageEngine bills in bands of administrators, and `flat_tiered` can
# only band on monitored assets — so that entry carries an explicit assumption
# converting one to the other. It is the crudest number in the catalog and it
# is labelled as such on the entry.

category: pam

products:
  - id: apache-guacamole
    name: Apache Guacamole
    vendor: Apache Software Foundation
    category: pam
    subcategory: clientless remote access gateway with session recording
    licenceModel: open_source
    maturity: established

    tiers:
      - id: open
        name: Apache Guacamole (self-hosted)
        capabilities:
          - Clientless browser access to RDP, VNC and SSH
          - Session recording and playback
          - Per-connection access control by user and group
          - LDAP, SAML and TOTP authentication back-ends
          - A single audited entry point to internal systems
        pricing:
          - model: zero_licence
            pricingConfidence: public_list
            refresh:
              method: manual
              checkUrl: https://guacamole.apache.org/
              note: >-
                Apache Software Foundation projects do not change licence, so
                this is close to a permanent fact. Worth re-checking only that
                the project is still actively released.
            sources:
              - url: https://guacamole.apache.org/
                asOf: '2026-09-12'
            notes: >-
              Apache License 2.0. The project states it "is and will always be
              free and open source software". No licence fee at any user count;
              the cost is the gateway it runs on and the engineer who owns it.

    supports:
      os: [linux, windows]
      deviceClasses: [server, workstation, identity, network_device]
      cloudPlatforms: []
      deploymentModes: [on_prem, hybrid, air_gapped]
      scaleFloor: small
      scaleCeiling: large
      airGapCapable: true

    integrations: [ldap, saml, rdp, ssh, vnc]

    controlsCovered:
      # A gateway, not a vault. It controls and records *access*; it does not
      # store, rotate or broker a credential, so the account-management controls
      # are deliberately absent.
      - cis-v8:6
      - nist-csf-2.0:PR.AA
      - iso-27001-2022:A.8.2
      - iso-27001-2022:A.8.3
      - iso-27001-2022:A.8.15
      - pci-dss-4.0:7
      - hipaa:164.312.a.1
      - soc-2:CC6
      - rbi-csf:privileged-access
      - nis2:21.2.i

    opsBurden:
      baseFte: 0.2
      ftePerThousandAssets: 0.1
      confidence: analyst_estimate
    implementation:
      effortDays: 8
      skillLevel: security_engineer
      typicalWeeks: 4
      confidence: analyst_estimate

    strengths:
      - Removes direct RDP and SSH exposure for the price of a VM, which is the single cheapest real win in this category
      - Session recording out of the box, which auditors ask for and most cheap tools do not have
      - Browser-based, so contractors and third parties need nothing installed
    weaknesses:
      - 'No credential vault: it controls who connects, not what the password is or when it last changed'
      - No just-in-time elevation, no approval workflow, no credential rotation
      - The gateway becomes a critical single point of failure and needs designing as one
    bestFor:
      - Clients whose immediate problem is unmanaged RDP and SSH access
      - Third-party and contractor access that must be watched
      - Air-gapped environments
    avoidWhen:
      - The obligation is credential rotation or vaulting, which this does not do
      - There is no engineer to own a new piece of access infrastructure

    sources:
      - url: https://guacamole.apache.org/
        asOf: '2026-09-12'
      - url: https://guacamole.apache.org/doc/gug/recording-playback.html
        asOf: '2026-09-12'
    notes: >-
      Catalogued as the floor of this category rather than a competitor to the
      rest of it. It closes the access-control and session-audit half of PAM and
      none of the credential half, and the control claims say so.

