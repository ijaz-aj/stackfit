              ⚠ THE CRUDEST NUMBER IN THE CATALOG. ManageEngine bands on
              *administrators*; `flat_tiered` can only band on monitored assets,
              and the sizing stage's privilegedAccountCount cannot reach this
              rule. The bands above therefore encode an assumption of roughly
              one administrator per 40 monitored assets, floored at the
              10-administrator band — so 400 assets buys the 10-admin band,
              2,000 assets the 50-admin band, and so on.

              That ratio is an analyst estimate and nothing more. Where the
              client has actually captured a privileged-account count, read the
              published band for that number off the vendor page and ignore this
              line. The prices are the vendor's; the mapping from estate size to
              band is not.

