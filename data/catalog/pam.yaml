    supports:
      os: [linux, windows, macos]
      deviceClasses:
        - server
        - workstation
        - database
        - container_node
        - cloud_workload
        - identity
        - web_app
      cloudPlatforms: [aws, azure, gcp]
      deploymentModes: [on_prem, hybrid, cloud, air_gapped]
      scaleFloor: small
      scaleCeiling: large
      airGapCapable: true

    integrations: [ssh, kubernetes, saml, oidc, ldap, rdp, postgres, mysql]

    controlsCovered:
      - cis-v8:5
      - cis-v8:6
      - nist-csf-2.0:PR.AA
      - iso-27001-2022:A.5.15
      - iso-27001-2022:A.5.17
      - iso-27001-2022:A.8.2
      - iso-27001-2022:A.8.3
      - iso-27001-2022:A.8.15
      - iso-27001-2022:A.8.18
      - pci-dss-4.0:7
      - pci-dss-4.0:8
      - hipaa:164.312.a.1
      - hipaa:164.308.a.4
      - soc-2:CC6
      - rbi-csf:privileged-access
      - rbi-csf:user-access-control
      - nis2:21.2.i

    opsBurden:
      baseFte: 0.35
      ftePerThousandAssets: 0.15
      confidence: analyst_estimate
    implementation:
      effortDays: 15
      skillLevel: security_engineer
      typicalWeeks: 6
      confidence: analyst_estimate

    strengths:
      - Kills long-lived SSH keys outright, which is a class of risk rather than an instance of one
      - One audited access path to servers, Kubernetes, databases and desktops
      - Just-in-time elevation and session recording without a commercial licence
    weaknesses:
      - 'Engineer-shaped, not admin-shaped: this is infrastructure to run, not an appliance to configure'
      - The "modified" Apache licence is not plain Apache 2.0 and should be read before it is relied on
      - Windows and legacy estates are served less naturally than Linux and cloud-native ones
    bestFor:
      - Cloud-native and Kubernetes estates
      - Engineering-led organisations that will treat access as code
      - Clients who need session audit across more than just RDP
    avoidWhen:
      - The estate is Windows-first with no platform engineering capability
      - The requirement is a password vault for a helpdesk rather than access for engineers

    sources:
      - url: https://github.com/gravitational/teleport
        asOf: '2026-09-12'
    notes: >-
      licenceModel is open_core rather than open_source deliberately. Teleport's
      own wording is "modified Apache 2.0", the paid editions gate real
      capability, and calling it plain open source would overstate what the
      client is free to do.

  - id: passbolt
    name: Passbolt
    vendor: Passbolt SA
    category: pam
    subcategory: self-hosted team credential vault
    licenceModel: open_core
    maturity: established

    tiers:
      - id: community
        name: Community Edition
        capabilities:
          - End-to-end encrypted shared credential vault
          - Per-user and per-group sharing with granular permissions
          - Browser extension and command-line access
          - Self-hosted, with the database under the client's control
        pricing:
          - model: zero_licence
            pricingConfidence: public_list
            refresh:
              method: manual
              checkUrl: https://www.passbolt.com/pricing
              note: >-
                Confirm the Community Edition is still AGPLv3 and still
                advertised with unlimited users — the user limit is the thing
                most likely to appear.
            sources:
              - url: https://www.passbolt.com/pricing
                asOf: '2026-09-12'
            notes: >-
              Passbolt publishes the Community Edition as "Free" with "unlimited
              users", "open source under AGPLV3 license". Self-hosted only.

      - id: pro
        name: Pro Edition
        capabilities:
          - Everything in Community
          - LDAP and Active Directory user provisioning
          - SSO
          - Audit log of every credential access
          - Folders and password expiry policies
          - Vendor support
        pricing:
          - model: per_privileged_user_year
            unitPrice:
              amountMinor: 5880
              currency: USD
            minimumUnits: 10
            termYears: 1
            pricingConfidence: public_list
            refresh:
              method: manual
              checkUrl: https://www.passbolt.com/pricing
              note: >-
                Read the per-user-per-month figure and multiply by 12, and
                re-check the 10-user minimum, which is what decides the price
                for a small team rather than the rate.
            sources:
              - url: https://www.passbolt.com/pricing
                asOf: '2026-09-12'
            notes: >-
              USD 4.90 per user per month billed annually, so USD 58.80 per user
              per year, minimum 10 users. Billed here against privileged
              accounts rather than headcount, because a credential vault is
              bought for the people who hold shared secrets, not for everyone.
              If the client intends to roll it out company-wide, cost it as a
              per-employee line instead.
        controlsCovered:
          - iso-27001-2022:A.8.15
          - iso-27001-2022:A.5.18
          - hipaa:164.312.b
          - soc-2:CC4

    supports:
      os: [linux, windows, macos]
      deviceClasses: [identity, server, workstation]
      cloudPlatforms: []
      deploymentModes: [on_prem, hybrid, air_gapped]
      scaleFloor: small
      scaleCeiling: mid
      airGapCapable: true

    integrations: [ldap, saml, oidc]

    controlsCovered:
      # A vault, not a gateway — the mirror image of Guacamole. It manages and
      # protects the credential and has no view of the session it is used in,
      # so the monitoring and session-audit controls are absent.
      - cis-v8:5
      - cis-v8:6
      - nist-csf-2.0:PR.AA
      - iso-27001-2022:A.5.17
      - iso-27001-2022:A.8.2
      - iso-27001-2022:A.8.3
      - pci-dss-4.0:7
      - pci-dss-4.0:8
      - hipaa:164.312.a.1
      - soc-2:CC6
      - rbi-csf:privileged-access
      - nis2:21.2.i

    opsBurden:
      baseFte: 0.15
      ftePerThousandAssets: 0.05
      confidence: analyst_estimate
    implementation:
      effortDays: 6
      skillLevel: security_engineer
      typicalWeeks: 3
      confidence: analyst_estimate

    strengths:
      - Self-hosted end-to-end encryption, so the vendor never holds the client's secrets
      - Genuinely free at unlimited users in the Community Edition
      - Small enough to deploy and adopt in weeks rather than quarters
    weaknesses:
      - 'Vaulting only: no credential rotation, no session recording, no just-in-time elevation'
      - The audit log that an auditor will ask for is a Pro feature
      - Aimed at teams rather than enterprises; governance features are thin
    bestFor:
      - Clients whose privileged credentials currently live in a spreadsheet
      - Small teams that need shared secrets under control quickly and cheaply
      - Environments where secrets must not leave the premises
    avoidWhen:
      - The obligation is session recording or credential rotation
      - The estate has hundreds of privileged accounts needing lifecycle governance

    sources:
      - url: https://www.passbolt.com/pricing
        asOf: '2026-09-12'
    notes: >-
      The Enterprise Edition is quote-only ("Custom") and is not catalogued.

