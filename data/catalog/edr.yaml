# EDR / XDR.
#
# Prices are in minor units (hard rule 1). opsBurden and implementation are
# analyst estimates, not vendor figures.

category: edr

products:
  - id: crowdstrike-falcon-go
    name: CrowdStrike Falcon Go
    vendor: CrowdStrike
    category: edr
    subcategory: SMB endpoint protection bundle
    licenceModel: commercial
    maturity: established

    tiers:
      - id: go
        name: Falcon Go
        capabilities:
          - Next-generation antivirus
          - Device control
          - Express support
        pricing:
          - model: per_endpoint_year
            unitPrice:
              amountMinor: 5999
              currency: USD
            termYears: 1
            pricingConfidence: public_list
            refresh:
              method: manual
              checkUrl: https://www.crowdstrike.com/products/bundles/falcon-go/
              note: CrowdStrike publishes Go pricing openly; the Pro and Enterprise bundles are quote-only.
            sources:
              - url: https://www.crowdstrike.com/products/bundles/falcon-go/
                asOf: '2026-09-09'
            notes: USD 59.99 per device, billed annually, at published list. Volume discounting not modelled here.

    supports:
      os: [windows, macos]
      deviceClasses: [server, workstation]
      cloudPlatforms: []
      deploymentModes: [cloud]
      scaleFloor: small
      scaleCeiling: mid
      airGapCapable: false

    integrations: [syslog]

    controlsCovered:
      - cis-v8:2
      - cis-v8:10
      - nist-csf-2.0:PR.PS
      - nist-csf-2.0:DE.CM
      - pci-dss-4.0:5

    opsBurden:
      baseFte: 0.1
      ftePerThousandAssets: 0.1
      confidence: analyst_estimate
    implementation:
      effortDays: 3
      skillLevel: generalist
      typicalWeeks: 2
      confidence: analyst_estimate

    strengths:
      - Deploys in days with almost no tuning
      - Published list price, so budgeting does not need a vendor conversation
      - 'Very low operational burden: viable for teams with no security FTE'
    weaknesses:
      - 'Go is the entry bundle: no threat hunting, no managed detection, limited telemetry retention'
      - Linux is not covered in this bundle
      - SaaS-only console
    bestFor:
      - Small Windows and macOS estates with little or no security staff
      - Clients who need defensible endpoint protection quickly
    avoidWhen:
      - The estate is Linux-heavy
      - Air-gapped, or full EDR telemetry and hunting are required

    sources:
      - url: https://www.crowdstrike.com/products/bundles/falcon-go/
        asOf: '2026-09-09'

  - id: velociraptor
    name: Velociraptor
    vendor: Rapid7 (Velocidex)
    category: edr
    subcategory: open-source endpoint DFIR and hunting
    licenceModel: open_source
    maturity: established

    tiers:
      - id: open
        name: Velociraptor (self-hosted)
        capabilities:
          - Endpoint artefact collection at fleet scale
          - VQL hunting across the estate
          - Live forensic triage and remote acquisition
          - Client-side monitoring rules
        pricing:
          - model: zero_licence
            pricingConfidence: public_list
            refresh:
              method: manual
              checkUrl: https://github.com/Velocidex/velociraptor/blob/master/LICENSE
              note: Rapid7 owns Velocidex. Watch for a licence change or a commercial edition splitting off.
            sources:
              - url: https://github.com/Velocidex/velociraptor/blob/master/LICENSE
                asOf: '2026-09-09'
            notes: AGPLv3. No licence fee; cost is the analyst time to write and run hunts.

    supports:
      os: [windows, linux, macos]
      deviceClasses: [server, workstation, domain_controller]
      cloudPlatforms: []
      deploymentModes: [on_prem, hybrid, air_gapped]
      scaleFloor: small
      scaleCeiling: large
      airGapCapable: true

    integrations: [syslog, wazuh, thehive, elasticsearch]

    controlsCovered:
      - cis-v8:2
      - nist-csf-2.0:DE.CM
      - nist-csf-2.0:RS.AN
      - nist-csf-2.0:RS.MI

    opsBurden:
      baseFte: 0.4
      ftePerThousandAssets: 0.2
      confidence: analyst_estimate
    implementation:
      effortDays: 8
      skillLevel: specialist
      typicalWeeks: 4
      confidence: analyst_estimate

    strengths:
      - Exceptional incident-response and hunting reach for zero licence cost
      - Single lightweight agent, scales to large fleets on modest hardware
      - Runs air-gapped
    weaknesses:
      - Not a preventive control. It does not block or quarantine malware
      - VQL is a real skill; an unstaffed deployment produces nothing
      - No vendor SLA
    bestFor:
      - Pairing with a preventive AV/EDR to add hunting and DFIR depth
      - Teams with a skilled responder and no budget for a hunting platform
    avoidWhen:
      - It is being considered as the *only* endpoint control
      - Nobody on the team can write or adapt a hunt

    sources:
      - url: https://docs.velociraptor.app/docs/overview/
        asOf: '2026-09-09'
    notes: >-
      Deliberately catalogued as a complement, not a replacement, for preventive
      EDR. Scoring must not treat it as covering malware defence (CIS Control 10)
      or PCI DSS requirement 5.

  - id: microsoft-defender-for-endpoint
    name: Microsoft Defender for Endpoint
    vendor: Microsoft
    category: edr
    subcategory: enterprise EDR/XDR
    licenceModel: commercial
    maturity: established

    tiers:
      - id: plan-1
        name: Defender for Endpoint Plan 1
        capabilities:
          - Next-generation antivirus
          - Attack surface reduction rules
          - Device control
          - Web protection
        pricing:
          - model: per_user_year
            unitPrice:
              amountMinor: 3600
              currency: USD
            termYears: 1
            pricingConfidence: analyst_estimate
            refresh:
              method: manual
              checkUrl: https://www.microsoft.com/en-us/microsoft-365/enterprise/microsoft365-plans-and-pricing
              note: >-
                Not machine-refreshable. Microsoft's retail price API covers Azure
                meters, not Microsoft 365 seat SKUs, so this one needs a person:
                ideally the client's reseller, since the E3/E5 base matters more
                than the standalone rate.
            sources:
              - url: https://redresscompliance.com/microsoft-defender-for-endpoint-licensing-p1-vs-p2
                asOf: '2026-09-09'
              - url: https://agileit.com/news/defender-endpoint-p1-pricing-features-comparison/
                asOf: '2026-09-09'
            notes: >-
              USD 3.00 per user per month, i.e. USD 36.00 per user per year.
              Marked analyst_estimate rather than public_list deliberately:
              Microsoft does not publish standalone per-plan pricing on any of
              its own pages. The product page quotes only the bundled Defender
              Suite at USD 12.00 per user per month. This figure is the widely
              and consistently reported list rate from licensing specialists,
              corroborated across independent sources, but it is not
              vendor-published. Confirm with the client's reseller before it
              reaches a proposal. P1 is included in Microsoft 365 E3.

      - id: plan-2
        name: Defender for Endpoint Plan 2
        # Claims on top of the product-level list, matching the capabilities
        # below: EDR telemetry is what makes continuous monitoring real, live
        # response and advanced hunting are what make incident analysis real,
        # and software inventory arrives with threat and vulnerability
        # management.
        #
        # cis-v8:7 is a deliberate exception to that control's own satisfiedBy,
        # which names vulnerability_management alone. Defender Vulnerability
        # Management is continuous, agent-based and sold inside this tier, so
        # for a client buying Plan 2 it is a purchase that genuinely does the
        # job. It is claimed here and nowhere else: Plan 1 has no TVM, and
        # before tier-level claims existed this entry credited Plan 1 with it.
        # A category mapping is a floor for what a *kind* of tool does, not a
        # ceiling on what one product can claim.
        controlsCovered:
          - cis-v8:2
          - cis-v8:7
          - nist-csf-2.0:DE.CM
          - nist-csf-2.0:RS.AN
        capabilities:
          - Everything in Plan 1
          - Endpoint detection and response with live response
          - Automated investigation and remediation
          - Threat and vulnerability management
          - Advanced hunting with six months of telemetry retention
        pricing:
          - model: per_user_year
            unitPrice:
              amountMinor: 6240
              currency: USD
            termYears: 1
            pricingConfidence: analyst_estimate
            refresh:
              method: manual
              checkUrl: https://www.microsoft.com/en-us/microsoft-365/enterprise/microsoft365-plans-and-pricing
              note: >-
                Not machine-refreshable. Microsoft's retail price API covers Azure
                meters, not Microsoft 365 seat SKUs, so this one needs a person:
                ideally the client's reseller, since the E3/E5 base matters more
                than the standalone rate.
            sources:
              - url: https://redresscompliance.com/microsoft-defender-for-endpoint-licensing-p1-vs-p2
                asOf: '2026-09-09'
              - url: https://costbench.com/software/endpoint-security/microsoft-defender-endpoint/
                asOf: '2026-09-09'
            notes: >-
              USD 5.20 per user per month, i.e. USD 62.40 per user per year.
              analyst_estimate for the same reason as Plan 1. Not published by
              Microsoft directly.

              Licensing reality that usually decides this product: P2 is
              included in Microsoft 365 E5. A client already on E5 pays nothing
              marginal for it, which is why Defender frequently wins on price
              against a technically stronger competitor. From an E3 base,
              reaching P2 means either the E5 Security add-on or a full E5
              upgrade. A much larger number than the standalone rate above.
              Establish which base the client is on before costing this.

    supports:
      os: [windows, linux, macos, ios, android]
      deviceClasses: [server, workstation, domain_controller, mobile]
      cloudPlatforms: [azure, m365]
      deploymentModes: [cloud, hybrid]
      scaleFloor: mid
      scaleCeiling: enterprise
      airGapCapable: false

    integrations: [microsoft-sentinel, syslog]

    # Product level is what *every* tier delivers, so this is the Plan 1 list:
    # next-generation antivirus, attack surface reduction, device control and
    # web protection. Everything that needs EDR telemetry, live response,
    # automated investigation or threat and vulnerability management is claimed
    # on plan-2 above, where it is actually sold.
    #
    # cis-v8:7 (Continuous Vulnerability Management) is deliberately absent
    # here and claimed on plan-2 only. A Plan 1 client who needs continuous
    # vulnerability management should see it as a gap and buy a tool for it.
    controlsCovered:
      - cis-v8:4
      - cis-v8:10
      - nist-csf-2.0:PR.PS
      - nist-csf-2.0:RS.MI
      - pci-dss-4.0:5

    opsBurden:
      baseFte: 0.25
      ftePerThousandAssets: 0.15
      confidence: analyst_estimate
    implementation:
      effortDays: 10
      skillLevel: security_engineer
      typicalWeeks: 4
      confidence: analyst_estimate

    strengths:
      - Often already licensed via Microsoft 365 E5, making the marginal cost near zero
      - Built-in vulnerability management removes the need for a separate VM tool in some scopes
      - Deep integration with Sentinel and Entra ID
    weaknesses:
      - Licensing is genuinely hard to price without a reseller conversation
      - Best value is locked to committing to the wider Microsoft estate
      - SaaS-only management plane
    bestFor:
      - Clients already on or moving to Microsoft 365 E5
      - Mixed Windows/Linux/macOS estates needing one agent
    avoidWhen:
      - Air-gapped environments
      - The client has no Microsoft 365 relationship, where standalone pricing rarely wins

    sources:
      - url: https://learn.microsoft.com/en-us/defender-endpoint/microsoft-defender-endpoint
        asOf: '2026-09-09'
    notes: >-
      Both tier prices are analyst_estimate, not vendor-published. The number
      that actually matters on most deals is whether the client is on E3 or E5,
      not the standalone rate. See the Plan 2 pricing note.

  - id: sentinelone-singularity
    name: SentinelOne Singularity
    vendor: SentinelOne
    category: edr
    subcategory: autonomous endpoint protection and EDR
    licenceModel: commercial
    maturity: established

    tiers:
      - id: complete
        name: Singularity Complete
        capabilities:
          - Endpoint protection and endpoint detection and response in one agent
          - Automated threat response on the endpoint
          - Managed threat hunting available as an add-on
          - Managed detection and response available as an add-on
        pricing:
          - model: per_endpoint_year
            unitPrice:
              amountMinor: 17999
              currency: USD
            termYears: 1
            pricingConfidence: public_list
            refresh:
              method: manual
              checkUrl: https://www.sentinelone.com/pricing/
              note: >-
                SentinelOne publishes an annual per-endpoint figure directly,
                which is unusual above the SMB tier. Read it as quoted rather
                than converting from a monthly rate. Also re-check which
                managed services are included versus add-on at each tier, since
                that is what separates Complete from Commercial.
            sources:
              - url: https://www.sentinelone.com/pricing/
                asOf: '2026-09-12'
            notes: >-
              USD 179.99 per endpoint per year, published as an annual figure.
              Managed threat hunting and MDR are both add-ons at this tier and
              are not included in the rate.

      - id: commercial
        name: Singularity Commercial
        capabilities:
          - Everything in Complete
          - Managed threat hunting included rather than an add-on
          - Managed detection and response still available as an add-on
        pricing:
          - model: per_endpoint_year
            unitPrice:
              amountMinor: 22999
              currency: USD
            termYears: 1
            pricingConfidence: public_list
            refresh:
              method: manual
              checkUrl: https://www.sentinelone.com/pricing/
              note: Read the annual per-endpoint figure as quoted.
            sources:
              - url: https://www.sentinelone.com/pricing/
                asOf: '2026-09-12'
            notes: >-
              USD 229.99 per endpoint per year. The USD 50 premium over Complete
              buys managed threat hunting; MDR remains an add-on.
        controlsCovered:
          - iso-27001-2022:A.5.7
          - nist-csf-2.0:DE.AE

    supports:
      os: [windows, linux, macos]
      deviceClasses: [workstation, server, cloud_workload, container_node]
      cloudPlatforms: [aws, azure, gcp]
      deploymentModes: [cloud]
      scaleFloor: small
      scaleCeiling: enterprise
      airGapCapable: false

    integrations: [syslog, microsoft-sentinel, microsoft-entra-id]

    controlsCovered:
      # Deliberately the same conservative core Falcon Go claims, plus response.
      # The capability detail on this entry is thinner than the rest of the
      # catalog (see notes), so the claims are held to what any full EDR with
      # automated response demonstrably does rather than to a feature list that
      # was not re-read from the vendor.
      - cis-v8:2
      - cis-v8:10
      - nist-csf-2.0:PR.PS
      - nist-csf-2.0:DE.CM
      - nist-csf-2.0:RS.MI
      - iso-27001-2022:A.8.1
      - iso-27001-2022:A.8.7
      - pci-dss-4.0:5
      - soc-2:CC7
      - rbi-csf:anti-malware

    opsBurden:
      baseFte: 0.15
      ftePerThousandAssets: 0.12
      confidence: analyst_estimate
    implementation:
      effortDays: 5
      skillLevel: security_engineer
      typicalWeeks: 3
      confidence: analyst_estimate

    strengths:
      - Publishes an annual per-endpoint price, which almost nothing at this tier of the market does
      - One agent covering endpoints, servers and cloud workloads
      - A visible upgrade path to managed hunting and MDR without changing product
    weaknesses:
      - Materially dearer than the SMB bundles, and the managed services that make it compelling are extra
      - SaaS-only management plane, so air-gapped scopes eliminate it
      - Enterprise tier is quote-only, so the top of the range has no visible price
    bestFor:
      - Mid-market and larger estates wanting a full EDR with a defensible budget figure up front
      - Mixed Windows, Linux and macOS fleets under one agent
    avoidWhen:
      - The environment is air-gapped
      - The budget only stretches to an entry endpoint bundle

    sources:
      - url: https://www.sentinelone.com/pricing/
        asOf: '2026-09-12'
    notes: >-
      ⚠ THE PRICES ARE SOLID AND THE CAPABILITY DETAIL IS THINNER THAN THE REST
      OF THIS CATALOG. Both rates are read verbatim from SentinelOne's own
      pricing page, as is the managed-services matrix that distinguishes the
      tiers. The wider feature list was not re-read from the vendor's product
      pages, so the capabilities and control claims above are held deliberately
      conservative. No more than any full EDR with automated response does.
      Widen them only after reading SentinelOne's own feature documentation.

      Singularity Enterprise is quote-only and is not catalogued. Singularity
      Core and Control appear in the comparison table without their own
      published prices and are likewise absent.

  - id: bitdefender-gravityzone
    name: Bitdefender GravityZone
    vendor: Bitdefender
    category: edr
    subcategory: mid-market endpoint protection with EDR
    licenceModel: commercial
    maturity: established

    tiers:
      - id: business-security
        name: Business Security
        capabilities:
          - Prevention-focused endpoint protection
          - Anti-malware, anti-exploit and web filtering
          - Centralised policy management
        pricing:
          - model: per_endpoint_year
            unitPrice:
              amountMinor: 7700
              currency: USD
            termYears: 1
            pricingConfidence: analyst_estimate
            refresh:
              method: manual
              checkUrl: https://www.bitdefender.com/business/
              note: >-
                Check first whether Bitdefender has started publishing a
                per-device rate on its own site; if it has, regrade to
                public_list. Otherwise re-derive from reseller catalogues and
                expect a spread. The reported figures move with the reseller,
                not with Bitdefender.
            sources:
              - url: https://www.bitdefender.com/business/
                asOf: '2026-09-12'
              - url: https://edrcost.com/bitdefender-gravityzone-pricing
                asOf: '2026-09-12'
            notes: >-
              ⚠ NOT VENDOR-PUBLISHED. Bitdefender publishes no standard
              per-endpoint price. USD 77 per device per year is aggregated from
              reseller catalogues and buyer-reported quotes, and the source that
              reports it says plainly that these "are estimates, not quotes".

              This tier is deliberately catalogued as the cheaper, prevention-
              only option. It does NOT include EDR, and its control claims say
              so.

      - id: business-security-premium
        name: Business Security Premium
        capabilities:
          - Everything in Business Security
          - Endpoint detection and response
          - Cloud sandboxing and detonation
          - Incident visualisation and root-cause analysis
          - Risk analytics for endpoint misconfiguration
        pricing:
          - model: per_endpoint_year
            unitPrice:
              amountMinor: 9589
              currency: USD
            termYears: 1
            pricingConfidence: analyst_estimate
            refresh:
              method: manual
              checkUrl: https://www.bitdefender.com/business/
              note: See the Business Security tier. The whole product is on estimated pricing.
            sources:
              - url: https://www.bitdefender.com/business/
                asOf: '2026-09-12'
              - url: https://edrcost.com/bitdefender-gravityzone-pricing
                asOf: '2026-09-12'
            notes: >-
              ⚠ NOT VENDOR-PUBLISHED. USD 95.89 per device per year, reported
              rather than published. This is the cheapest tier that includes
              EDR, which is what makes it the one worth quoting. The base tier
              below it is prevention only.
        controlsCovered:
          - cis-v8:13
          - nist-csf-2.0:DE.AE
          - nist-csf-2.0:RS.AN
          - iso-27001-2022:A.5.28
          - iso-27001-2022:A.8.16
          - soc-2:CC7

    supports:
      os: [windows, linux, macos]
      deviceClasses: [workstation, server, hypervisor, container_node, cloud_workload]
      cloudPlatforms: [aws, azure, gcp]
      deploymentModes: [cloud, hybrid, on_prem]
      scaleFloor: small
      scaleCeiling: large
      airGapCapable: false

    integrations: [syslog, microsoft-sentinel, microsoft-entra-id]

    controlsCovered:
      # What both tiers do. EDR, sandboxing and root-cause analysis arrive only
      # at Premium and are claimed there, so selecting the base tier does not
      # credit the client with detection they have not bought.
      - cis-v8:2
      - cis-v8:10
      - nist-csf-2.0:PR.PS
      - nist-csf-2.0:DE.CM
      - nist-csf-2.0:RS.MI
      - iso-27001-2022:A.8.1
      - iso-27001-2022:A.8.7
      - pci-dss-4.0:5
      - rbi-csf:anti-malware

    opsBurden:
      baseFte: 0.15
      ftePerThousandAssets: 0.12
      confidence: analyst_estimate
    implementation:
      effortDays: 5
      skillLevel: generalist
      typicalWeeks: 3
      confidence: analyst_estimate

    strengths:
      - Consistently strong detection results for a mid-market price point
      - On-premises management console is available, which the SaaS-only competitors do not offer
      - One console across workstations, servers and virtualised workloads
    weaknesses:
      - 'No published price: every figure here is reported rather than vendor-stated'
      - 'The base tier is prevention only: buying "Bitdefender" does not mean buying EDR, and the gap is easy to miss'
      - Enterprise tier with XDR is quote-only, so the top of the range has no visible price
    bestFor:
      - Mid-market clients wanting credible EDR without CrowdStrike or SentinelOne pricing
      - Estates that need an on-premises console for data-residency reasons
    avoidWhen:
      - Budget certainty matters and a reseller quote cannot be obtained in time
      - The environment is air-gapped

    sources:
      - url: https://www.bitdefender.com/business/
        asOf: '2026-09-12'
    notes: >-
      Both tiers carry analyst-estimated pricing and will show a
      pricing-confidence warning wherever they are costed. That warning is
      correct.

      The tier split is the point of this entry. Bitdefender's base Business
      Security is prevention only; EDR starts at Premium. A proposal that says
      "Bitdefender" without saying which tier is a proposal that may not include
      EDR at all, and the control claims here are split so the tool cannot make
      that mistake on an analyst's behalf.
