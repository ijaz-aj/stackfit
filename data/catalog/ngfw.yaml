    category: ngfw
    subcategory: managed cloud network firewall
    licenceModel: commercial
    maturity: established

    tiers:
      - id: standard
        name: Standard endpoint
        capabilities:
          - Stateful and stateless rule groups for VPC traffic
          - Suricata-compatible rule syntax
          - Managed threat-intelligence rule groups
          - Domain filtering
          - Centralised policy across accounts via Firewall Manager
        pricing:
          - model: flat_tiered
            tiers:
              - minUnits: 0
                maxUnits: null
                flatPrice:
                  amountMinor: 346020
                  currency: USD
            termYears: 1
            pricingConfidence: public_list
            refresh:
              method: manual
              checkUrl: https://aws.amazon.com/network-firewall/pricing/
              note: >-
                Read the per-endpoint-hour rate and multiply by 8,760. AWS
                quotes per region, so re-read it for the client's own region;
                also check whether the secondary-endpoint rate now applies,
                because a multi-AZ deployment needs more than one endpoint.
            sources:
              - url: https://aws.amazon.com/network-firewall/pricing/
                asOf: '2026-09-12'
            notes: >-
              AWS publishes "$0.395 for each hour your firewall endpoint is
              provisioned" for US East (N. Virginia), so USD 3,460.20 for a year
              of continuous running per endpoint.

              Three things this rate does not capture.
              (1) Data processing at USD 0.065 per GB, not modelled for the
              reason in the file header.
              (2) One endpoint per availability zone. A production VPC across
              three AZs needs three, and secondary endpoints are cheaper at USD
              0.158/hour — this entry models one.
              (3) TLS inspection adds USD 0.489/hour and Advanced Threat
              Protection adds USD 0.005/GB, neither included.

    supports:
      os: [network_os]
      deviceClasses: [firewall, cloud_workload, network_device]
      cloudPlatforms: [aws]
      deploymentModes: [cloud]
      scaleFloor: small
      scaleCeiling: enterprise
      airGapCapable: false

    integrations: [suricata, syslog, s3]

    controlsCovered:
      - cis-v8:12
      - cis-v8:13
      - nist-csf-2.0:PR.IR
      - nist-csf-2.0:DE.CM
      - iso-27001-2022:A.8.20
      - iso-27001-2022:A.8.21
      - iso-27001-2022:A.8.22
      - pci-dss-4.0:1
      - soc-2:CC6
      - gdpr:art-32
      - rbi-csf:network-management
      - rbi-csf:network-segmentation

    opsBurden:
      baseFte: 0.15
      ftePerThousandAssets: 0.05
      confidence: analyst_estimate
    implementation:
      effortDays: 6
      skillLevel: security_engineer
      typicalWeeks: 3
      confidence: analyst_estimate

    strengths:
      - Suricata-compatible rules, so detection content is portable rather than vendor-locked
      - Central policy across every account through Firewall Manager
      - Scales with the VPC rather than with an appliance refresh cycle
    weaknesses:
      - 'Protects VPC traffic only: nothing outside AWS is in scope'
      - The per-endpoint-per-AZ model makes a resilient deployment cost two or three times the headline
      - No GUI policy authoring worth the name — this is rules as code or nothing
    bestFor:
      - AWS-resident estates needing egress filtering and inspection between VPCs
      - Clients already writing Suricata rules elsewhere
    avoidWhen:
      - The perimeter is physical
      - The environment is air-gapped

    sources:
      - url: https://aws.amazon.com/network-firewall/pricing/
        asOf: '2026-09-12'
    notes: >-
      Modelled as a single endpoint. Nearly every production deployment needs
      one per availability zone, so multiply by the AZ count before quoting.

