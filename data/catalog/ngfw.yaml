# NGFW — network security controls at the edge and between segments.
#
# Prices are in minor units (hard rule 1).
#
# ⚠ TWO COST LINES THIS CATEGORY NEEDS AND THE ENGINE DOES NOT HAVE.
#
# (1) Hardware capex. An on-premises firewall is an appliance before it is a
#     subscription, and the cost model has no hardware line — §7.2 names one,
#     the implementation is licence, support, infrastructure, ops FTE,
#     implementation and training. For the appliance vendors below that means
#     the first year is understated by whatever the box costs. Every affected
#     entry says so.
#
# (2) Network throughput. The cloud firewalls bill per GB of traffic processed
#     as well as per hour of deployment. The sizing stage derives log ingest in
#     GB/day, which is a different and much smaller quantity, so billing
#     traffic against it would be confidently wrong. The deployment fee is
#     modelled and the data-processing fee is named in the notes instead.
#
# Neither is a rounding error, and an analyst should read both before quoting
# anything from this file.

category: ngfw

products:
  - id: opnsense
    name: OPNsense
    vendor: Deciso B.V.
    category: ngfw
    subcategory: open-source firewall and routing platform
    licenceModel: open_source
    maturity: established

    tiers:
      - id: community
        name: Community Edition
        capabilities:
          - Stateful firewalling with aliases and rule groups
          - Network segmentation with VLANs and multiple interfaces
          - IPsec and WireGuard VPN
          - Suricata intrusion detection and prevention
          - Web proxy with category filtering
          - Two-factor authentication for administration
        pricing:
          - model: zero_licence
            pricingConfidence: public_list
            refresh:
              method: manual
              checkUrl: https://github.com/opnsense/core
              note: >-
                The project commits to the 2-Clause BSD licence in its own
                README, which makes a change unlikely. Worth re-checking only
                that the community edition still receives the same features as
                the business edition rather than lagging it.
            sources:
              - url: https://github.com/opnsense/core
                asOf: '2026-09-12'
            notes: >-
              2-Clause BSD. OPNsense states it "is and will always be available
              under the 2-Clause BSD license". No licence fee, no throughput
              limit, no feature gate — the business edition below buys a
              different update track and support, not capability.

      - id: business
        name: Business Edition
        capabilities:
          - Everything in the Community Edition
          - The commercial update track, with longer-tested releases
          - Vendor support
          - Additional enterprise plugins
        pricing:
          - model: flat_tiered
            tiers:
              - minUnits: 0
                maxUnits: 500
                flatPrice:
                  amountMinor: 14900
                  currency: EUR
              - minUnits: 501
                maxUnits: 2000
                flatPrice:
                  amountMinor: 29800
                  currency: EUR
              - minUnits: 2001
                maxUnits: null
                flatPrice:
                  amountMinor: 59600
                  currency: EUR
            termYears: 1
            pricingConfidence: public_list
            refresh:
              method: manual
              checkUrl: https://shop.opnsense.com/product/opnsense-business-edition/
              note: >-
                Read the annual price from the OPNsense shop. Also re-check the
                one-installation restriction, which is what makes the banding
                below necessary, and whether VAT is stated — the shop does not
                say, and for an EU client that is a 20%-ish difference.
            sources:
              - url: https://shop.opnsense.com/product/opnsense-business-edition/
                asOf: '2026-09-12'
            notes: >-
              OPNsense's own shop publishes "€149,00 / year" and states "This
              license is valid for only one installation".

              ⚠ The bands are an analyst assumption over that published rate,
              not an OPNsense price list. Because the licence is per
              installation, the bands encode one firewall up to 500 monitored
              assets, two to 2,000 and four above that. A real estate is
              segmented by site and security zone, not by asset count, so check
              the firewall count rather than trusting this. Deciso asks
              multi-installation buyers to contact sales, so volume pricing
              may apply and is not modelled.

    supports:
      os: [network_os]
      deviceClasses: [firewall, network_device, server]
      cloudPlatforms: [aws, azure]
      deploymentModes: [on_prem, hybrid, cloud, air_gapped]
      scaleFloor: small
      scaleCeiling: large
      airGapCapable: true

    integrations: [suricata, syslog, ldap, radius, wireguard, ipsec]

    controlsCovered:
      - cis-v8:12
      - cis-v8:13
      - nist-csf-2.0:PR.IR
      - nist-csf-2.0:DE.CM
      - iso-27001-2022:A.8.20
      - iso-27001-2022:A.8.21
      - iso-27001-2022:A.8.22
      - iso-27001-2022:A.8.23
      - pci-dss-4.0:1
      - soc-2:CC6
      - gdpr:art-32
      - rbi-csf:network-management
      - rbi-csf:network-segmentation

    opsBurden:
      baseFte: 0.2
      ftePerThousandAssets: 0.1
      confidence: analyst_estimate
    implementation:
      effortDays: 10
      skillLevel: security_engineer
      typicalWeeks: 5
      confidence: analyst_estimate

    strengths:
      - No licence fee and no throughput licensing, so capacity is a hardware decision rather than a commercial one
      - Genuinely BSD-licensed with a public commitment to stay that way
      - Suricata IPS and web filtering included, which are separate line items at most commercial vendors
    weaknesses:
      - You own the hardware choice, the sizing and the failure modes
      - No central management console across many sites without additional tooling
      - Threat intelligence and application control are thinner than a commercial UTM bundle
    bestFor:
      - Cost-constrained clients with competent network staff
      - Air-gapped or residency-constrained environments
      - Segmentation projects where licensing per zone would be prohibitive
    avoidWhen:
      - There is nobody to own firewall rule changes and upgrades
      - A single console across dozens of sites is a hard requirement

    sources:
      - url: https://github.com/opnsense/core
        asOf: '2026-09-12'
      - url: https://shop.opnsense.com/product/opnsense-business-edition/
        asOf: '2026-09-12'
    notes: >-
      Hardware is not costed. OPNsense runs on commodity x86 or on Deciso
      appliances, and neither appears in the TCO — see the file header. For a
      multi-site estate that omission is larger than the entire licence line.

