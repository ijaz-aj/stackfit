      deviceClasses: [firewall, network_device, server]
      cloudPlatforms: [aws, azure]
      deploymentModes: [on_prem, hybrid, cloud, air_gapped]
      scaleFloor: small
      scaleCeiling: large
      airGapCapable: true

    integrations: [suricata, snort, syslog, ldap, radius, wireguard, ipsec]

    controlsCovered:
      - cis-v8:12
      - cis-v8:13
      - nist-csf-2.0:PR.IR
      - nist-csf-2.0:DE.CM
      - iso-27001-2022:A.8.20
      - iso-27001-2022:A.8.21
      - iso-27001-2022:A.8.22
      - pci-dss-4.0:1
      - soc-2:CC6
      - gdpr:art-32
      - rbi-csf:network-management
      - rbi-csf:network-segmentation

    opsBurden:
      baseFte: 0.2
      ftePerThousandAssets: 0.1
      confidence: analyst_estimate
    implementation:
      effortDays: 10
      skillLevel: security_engineer
      typicalWeeks: 5
      confidence: analyst_estimate

    strengths:
      - The most widely deployed open-source firewall, so hiring for it and finding answers is easy
      - Netgate appliances give a supported hardware path that OPNsense leaves to the buyer
      - Plus is cheap for what it is, at a published price
    weaknesses:
      - 'Open core in practice: the free edition is deliberately positioned below the paid one and the gap has widened over time'
      - Web filtering is package-based and less integrated than OPNsense's
      - No central multi-site management without separate tooling
    bestFor:
      - Clients who want an open-source firewall with a vendor behind it
      - Sites where a supported appliance matters more than licence freedom
    avoidWhen:
      - Licence freedom is the reason open source was on the list
      - A single console across dozens of sites is a hard requirement

    sources:
      - url: https://github.com/pfsense/pfsense
        asOf: '2026-09-12'
      - url: https://www.netgate.com/pfsense-plus-software
        asOf: '2026-09-12'
