      - Policy is infrastructure-as-code and versions with the rest of the estate
      - Logs land in Sentinel with no connector to build
    weaknesses:
      - 'Protects Azure virtual networks only: it does nothing for an office, a branch or a data centre'
      - 'Expensive for what it is at small scale: a Standard deployment costs about USD 11,000 a year before a single GB flows'
      - Hourly billing means it costs the same whether it is busy or idle
    bestFor:
      - Estates whose real perimeter is an Azure virtual network
      - Clients already committed to Azure networking and Sentinel
    avoidWhen:
      - The perimeter is a physical office or data centre
      - The environment is air-gapped

    sources:
