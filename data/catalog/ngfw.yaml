        asOf: '2026-09-12'
    notes: >-
      Costed on the deployment fee alone. For a high-traffic estate the
      data-processing charge is a material second line and this entry will
      understate — see the file header for why it is omitted rather than
      guessed.

  - id: aws-network-firewall
