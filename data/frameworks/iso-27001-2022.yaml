# ISO/IEC 27001:2022 Annex A — all 93 controls across the four themes.
#
# All 93 are listed, including the many no product can close. That is
# deliberate: coverage is a percentage, and a denominator that quietly omitted
# the governance and people controls would make every bundle look far better
# against ISO than it is.
#
# `satisfiedBy` is StackFit's own mapping, not part of the standard.
#
# Nothing is marked mandatory. ISO 27001 certification is against a scoped
# ISMS with a Statement of Applicability — the organisation justifies which
# Annex A controls apply. A tool cannot decide that for them.

id: iso-27001-2022
name: ISO/IEC 27001 Annex A
sourceQuality: secondary_sources
version: '2022'
commonIn: [global]

sources:
  - url: https://www.iso.org/standard/27001
    asOf: '2026-09-09'
  - url: https://gaicc.org/blog/iso-27001-annex-a-controls-list/
    asOf: '2026-09-09'

notes: >-
  sourceQuality is secondary_sources because ISO sells the standard rather than
  publishing it — the control list cannot be read from the publisher without a
  licence. The 93-control, four-theme structure and the control titles below
  were corroborated across independent sources. Verify against a licensed copy
  before a client-facing coverage claim.

