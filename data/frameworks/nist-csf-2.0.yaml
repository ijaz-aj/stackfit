# NIST Cybersecurity Framework 2.0. The 22 Categories of the CSF Core.
#
# Controls are held at Category level, not Subcategory. Categories are the
# granularity at which a product category ("a SIEM") is a meaningful answer;
# the 106 Subcategories are the granularity at which a control statement is.
#
# `satisfiedBy` is StackFit's own judgement about which product categories
# materially contribute to a Category. It is not part of the published
# framework and an analyst should be willing to argue with it.
#
# CSF 2.0 is voluntary guidance, so no Category is marked mandatory: nothing
# here compels a purchase the way PCI DSS does.

id: nist-csf-2.0
name: NIST Cybersecurity Framework
sourceQuality: publisher_verified
version: '2.0'
commonIn: [us, global]

sources:
  - url: https://www.nist.gov/cyberframework
    asOf: '2026-09-09'
  - url: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
    asOf: '2026-09-09'
  - url: https://csrc.nist.gov/extensions/nudp/services/json/csf/download?olirids=all
    asOf: '2026-09-09'

notes: >-
  sourceQuality is publisher_verified. Every Category id and name below was
  diffed against NIST's own machine-readable CSF 2.0 Core workbook, downloaded
  from the CSRC endpoint listed above. All 22 match verbatim.

  That workbook is the "with withdrawn CSF 1.1 elements" edition, so it also
  contains ID.BE, ID.GV, ID.RM, ID.SC, PR.AC, PR.IP, PR.MA, PR.PT, DE.DP,
  RS.RP, RS.IM and RC.IM. Those are withdrawn 1.1 categories and are correctly
  absent here. If a future diff shows them as missing, that is the reason.

groups:
  # The six CSF 2.0 Functions, in the published order. Every Category id below
  # is `<Function>.<Category>`, which is NIST's own identifier scheme. The
  # grouping is restated here rather than parsed out of the id, because
  # coverage.ts rolls up against it and a structural claim should be declared.
  - id: GV
    name: Govern
    notes: >-
      Added in 2.0. Almost nothing here is bought: it is strategy, roles, policy
      and oversight, so a stack will always score low against Govern and should.
  - id: ID
    name: Identify
  - id: PR
    name: Protect
  - id: DE
    name: Detect
  - id: RS
    name: Respond
  - id: RC
    name: Recover

controls:
  # GOVERN
  - id: GV.OC
    group: GV
    title: Organizational Context
    satisfiedBy: []
    notes: Governance outcome. No tool satisfies this.
  - id: GV.RM
    group: GV
    title: Risk Management Strategy
    satisfiedBy: []
  - id: GV.RR
    group: GV
    title: Roles, Responsibilities, and Authorities
    satisfiedBy: []
  - id: GV.PO
    group: GV
    title: Policy
    satisfiedBy: []
  - id: GV.OV
    group: GV
    title: Oversight
    satisfiedBy: []
  - id: GV.SC
    group: GV
    title: Cybersecurity Supply Chain Risk Management
    satisfiedBy: []
    notes: >-
      A Govern-function outcome: supplier risk criteria, contracts and
      oversight. Tooling helps with the inventory half; the control is the rest.

  # IDENTIFY
  - id: ID.AM
    group: ID
    title: Asset Management
    satisfiedBy: [asset_discovery, vulnerability_management]
  - id: ID.RA
    group: ID
    title: Risk Assessment
    satisfiedBy: [vulnerability_management]
  - id: ID.IM
    group: ID
    title: Improvement
    satisfiedBy: []

  # PROTECT
  - id: PR.AA
    group: PR
    title: Identity Management, Authentication, and Access Control
    satisfiedBy: [iam, pam]
  - id: PR.AT
    group: PR
    title: Awareness and Training
    satisfiedBy: []
  - id: PR.DS
    group: PR
    title: Data Security
    satisfiedBy: [backup]
    notes: PR.DS-11 covers creating, protecting and testing backups.
  - id: PR.PS
    group: PR
    title: Platform Security
    satisfiedBy: [edr, vulnerability_management]
  - id: PR.IR
    group: PR
    title: Technology Infrastructure Resilience
    satisfiedBy: [ngfw, ndr, backup]

  # DETECT
  - id: DE.CM
    group: DE
    title: Continuous Monitoring
    satisfiedBy: [siem, edr, ndr, email_security, deception]
  - id: DE.AE
    group: DE
    title: Adverse Event Analysis
    satisfiedBy: [siem, soar, mdr]

  # RESPOND
  - id: RS.MA
    group: RS
    title: Incident Management
    satisfiedBy: [soar, mdr, siem]
    notes: >-
      Same reasoning as cis-v8:17. RS.AN below already credits a SIEM with
      incident analysis; a platform that also carries the case through to
      containment is managing the incident, not only analysing it. A SIEM that
      does not make the claim still reads as partial.
  - id: RS.AN
    group: RS
    title: Incident Analysis
    satisfiedBy: [siem, edr, mdr]
  - id: RS.CO
    group: RS
    title: Incident Response Reporting and Communication
    satisfiedBy: [soar]
  - id: RS.MI
    group: RS
    title: Incident Mitigation
    satisfiedBy: [edr, soar, ngfw]

  # RECOVER
  - id: RC.RP
    group: RC
    title: Incident Recovery Plan Execution
    satisfiedBy: [backup]
  - id: RC.CO
    group: RC
    title: Incident Recovery Communication
    satisfiedBy: []
