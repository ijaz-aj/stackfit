  - id: bank-60-branches
    name: Bank, 60 branches
    description: RBI cyber security framework, card data, outsourced SOC already in place.
    basis: >-
      60 branches and a data centre. Per branch: 25 staff PCs, an ATM, 8
      cameras, a firewall, a router, 3 switches. Privileged and service account
      counts are high on purpose: core banking, middleware and reconciliation
      jobs each hold their own, and they are what size the PAM line.
    staffingBasis: >-
      25 IT for 1,800 staff is one per 72, the mainstream ratio, and banks sit
      there because the branch estate is uniform and centrally managed. 4
      security FTE reads low for a regulated bank until the outsourced SOC is
      counted: the RBI framework requires 24/7 monitoring and a full-time CISO
      who does not report to the Head of IT, and this client meets the first
      through a provider. The 4 are that mandated CISO plus three who run
      evidence, access recertification and the provider relationship. A bank
      running its own 24/7 SOC could not do it with 4, since round-the-clock
      single-analyst coverage alone is 4.2 FTE before leave.
    profile:
      industry: bfsi
      region: in
      employeeCount: 1800
      itStaffCount: 25
      securityStaffFte: 4
      hasSoc: outsourced
      riskTolerance: low
      dataSensitivity: critical
      compliance: [rbi-csf, pci-dss-4.0, dpdp-2023]
      budget:
        annualCap: { amountMinor: 3500000000, currency: INR } # INR 3,50,00,000
        oneTimeCap: { amountMinor: 1000000000, currency: INR } # INR 1,00,00,000
        currency: INR
        horizonYears: 3
      environment: on_prem
      procurementBias: no_preference
      retainedTools: []
      excludedProducts: []
