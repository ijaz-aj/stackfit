  - id: professional-services-45
    name: Professional services, 45 staff
    description: All SaaS, no compliance obligation, nobody whose job is security.
    basis: >-
      45 consultants, laptops and Microsoft 365, one small AWS account for the
      client portal. No server room, no security hire. The case §5.1 calls out
      as valid and very important, and the one where the managed alternative
      usually wins. Open-source-first is set deliberately: at this size the
      question is always whether free tools are actually cheaper.
    staffingBasis: >-
      1 IT for 45 consultants, and nobody whose job is security. Stated as 0
      rather than left blank, because 0 is the answer and the one that changes
      the recommendation most: every hour of operational effort in the stack
      has to come from that single IT hire or from a provider. This is the case
      §5.1 calls out as valid and important, and the one where the managed
      alternative usually wins.
    profile:
      industry: other
      region: us
      employeeCount: 45
      itStaffCount: 1
      securityStaffFte: 0
      hasSoc: none
      riskTolerance: medium
      dataSensitivity: internal
      compliance: []
