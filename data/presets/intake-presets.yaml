      serviceAccounts: { count: 25 }
      networkVendors: [cisco, fortinet]
      firewallThroughputClass: under_1g

  - id: saas-scale-up-120
    name: SaaS scale-up, 120 staff
    description: Cloud-native, no perimeter, SOC 2 audit on the calendar.
    basis: >-
      120 staff, mostly laptops, no office server room. AWS across 6 accounts
      (prod, staging, dev, data, security, shared services) with roughly 180
      workloads and a 24-node Kubernetes estate. Service accounts outnumber
      people, which is normal here and is why identity ranks first for this
      shape.
    staffingBasis: >-
      4 IT for 120 staff is one per 30, which is the tech-sector ratio rather
      than the general one, and right for a company whose staff are engineers
      with their own laptops. The 1 security FTE is the first security hire,
      usually made for the SOC 2 audit and usually still the only one at this
      size. Closest of the six to the IANS benchmark, at 0.83 per 100.
    profile:
      industry: saas
      region: us
      employeeCount: 120
      itStaffCount: 4
      securityStaffFte: 1
      hasSoc: none
      riskTolerance: medium
      dataSensitivity: regulated
      compliance: [soc-2, gdpr]
      budget:
