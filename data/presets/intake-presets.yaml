# Intake presets (PROJECT_SPEC §5.2).
#
# "Scoping calls do not produce clean data." A preset gets the analyst to a
# plausible environment in one click, which they then edit in front of the
# client — the difference between a 4-minute intake and a 40-minute one.
#
# ⚠ Every count here is an analyst estimate of what an estate of this shape
# typically looks like. None of it is measured, none of it is any particular
# client, and every preset states the arithmetic it was built from in `basis` so
# it can be argued with. They are starting points, never answers.
#
# Budget caps are procurement spend — licence, support and infrastructure — to
# match what the engine constrains. Salary is not procurement.

notes: >-
  Six shapes chosen to span the paths the engine actually treats differently:
  card data, cloud-native, operational technology, protected health information,
  an Indian regulated bank, and a small unregulated firm with no security staff
  at all.

presets:
  - id: retail-chain-40-stores
    name: Retail chain, 40 stores
    description: Card data in scope, thin IT team, a firewall and a till in every store.
    basis: >-
      40 stores plus a head office. Per store: 6 POS terminals, 8 cameras, 3
      back-office PCs, 1 firewall, 1 router, 2 switches. Head office adds 120
      staff PCs, the server estate and the e-commerce front end. Staff count is
      40 stores x 12 plus 120 at head office. The annual cap is what a retailer
      this size typically has room for once the network refresh is paid for.
    profile:
      industry: retail
      region: in
      employeeCount: 600
      itStaffCount: 6
      securityStaffFte: 1
      hasSoc: none
      riskTolerance: medium
      dataSensitivity: regulated
      compliance: [pci-dss-4.0, dpdp-2023]
      budget:
        annualCap: { amountMinor: 600000000, currency: INR } # INR 60,00,000
        oneTimeCap: { amountMinor: 200000000, currency: INR } # INR 20,00,000
        currency: INR
        horizonYears: 3
      deploymentPreference: hybrid
      procurementBias: no_preference
      retainedTools: []
      excludedProducts: []
    inventory:
      windowsEndpoints: { count: 240 }
      windowsServers: { count: 14 }
      windowsDomainControllers: { count: 2 }
      linuxServers: { count: 8 }
      hypervisors: { count: 4 }
      routers: { count: 42 }
      switches: { count: 90 }
      wirelessControllers: { count: 4 }
      firewalls: { count: 42, internetFacing: true }
      databases: { count: 4, criticality: crown_jewel }
      fileServers: { count: 3 }
      internalWebApps: { count: 3 }
      publicWebApps: { count: 1, internetFacing: true, criticality: crown_jewel }
      iotCctvPosDevices: { count: 560, criticality: crown_jewel }
      m365Seats: { count: 600 }
      remoteUsers: { count: 60 }
      privilegedAccounts: { count: 12 }
      serviceAccounts: { count: 25 }
      networkVendors: [cisco, fortinet]
      firewallThroughputClass: under_1g

