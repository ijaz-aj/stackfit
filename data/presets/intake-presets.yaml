# Intake presets (PROJECT_SPEC §5.2).
#
# "Scoping calls do not produce clean data." A preset gets the analyst to a
# plausible environment in one click, which they then edit in front of the
# client. The difference between a 4-minute intake and a 40-minute one.
#
# ⚠ Every count here is an analyst estimate of what an estate of this shape
# typically looks like. None of it is measured, none of it is any particular
# client, and every preset states the arithmetic it was built from in `basis` so
# it can be argued with. They are starting points, never answers.
#
# Budget caps are procurement spend: licence, support and infrastructure: to
# match what the engine constrains. Salary is not procurement.
#
# ⚠ On security headcount, and why it is not raised to the published benchmark.
#
# IANS Research and Artico Search put security staffing at about 1.5 FTE per 100
# employees below $50M revenue and 0.9 per 100 at $600M to $1B (2025 benchmark).
# Every preset here is under that, the hospital by roughly ten times. Three
# reasons it stays that way, all of which a reviewer is free to overturn:
#
#   1. That benchmark bands by *revenue*, and a preset carries headcount. The
#      two are not interchangeable across markets: an Indian hospital with 1,400
#      staff and a US company with 1,400 staff are nowhere near the same
#      revenue, so reading a per-employee figure out of a revenue band and
#      applying it here would be arithmetic dressed as evidence.
#   2. The respondents are overwhelmingly North American. No equivalent
#      published figure for the Indian mid-market could be found, and the one
#      headcount-based ratio that turns up (one security specialist per 5 to 10
#      IT staff, which every preset here already satisfies) is an uncited
#      industry convention rather than a survey.
#   3. Raising them would hide the finding. The Operable bundle exists to show a
#      client that the recommended stack needs more people than they have.
#      Inflating the assumed headcount shrinks exactly the gap the tool was
#      built to put in front of them.
#
# What these figures are, then: analyst estimates of a typical understaffed
# client, stated per preset in `staffingBasis`, and the first thing to correct
# on a real call. They are not a claim about what good looks like.
#
# Source: https://www.iansresearch.com/resources/press-releases/detail/ians-research-and-artico-search-release-security-budget-benchmark-report
# Read on 2026-09-12.

notes: >-
  Six shapes chosen to span the paths the engine actually treats differently:
  card data, cloud-native, operational technology, protected health information,
  an Indian regulated bank, and a small unregulated firm with no security staff
  at all.

presets:
  - id: retail-chain-40-stores
    name: Retail chain, 40 stores
    description: Card data in scope, thin IT team, a firewall and a till in every store.
    basis: >-
      40 stores plus a head office. Per store: 6 POS terminals, 8 cameras, 3
      back-office PCs, 1 firewall, 1 router, 2 switches. Head office adds 120
      staff PCs, the server estate and the e-commerce front end. Staff count is
      40 stores x 12 plus 120 at head office. The annual cap is what a retailer
      this size typically has room for once the network refresh is paid for.
    staffingBasis: >-
      6 IT for 600 staff is one per 100, the thin end of the usual range and
      normal for retail, where head office carries the whole estate and stores
      have none. The 1 security FTE is an analyst estimate: a single person who
      owns PCI evidence, vendor questionnaires and whatever the MSP escalates.
      Below the IANS 2025 benchmark of 1.5 per 100 employees under $50M
      revenue, and deliberately so, see the note at the head of this file.
    profile:
      industry: retail
      region: in
      employeeCount: 600
      itStaffCount: 6
      securityStaffFte: 1
      hasSoc: none
      riskTolerance: medium
      dataSensitivity: regulated
      compliance: [pci-dss-4.0, dpdp-2023]
      budget:
        annualCap: { amountMinor: 600000000, currency: INR } # INR 60,00,000
        oneTimeCap: { amountMinor: 200000000, currency: INR } # INR 20,00,000
        currency: INR
        horizonYears: 3
      environment: hybrid
      procurementBias: no_preference
      retainedTools: []
      excludedProducts: []
    inventory:
      windowsEndpoints: { count: 240 }
      windowsServers: { count: 14 }
      windowsDomainControllers: { count: 2 }
      linuxServers: { count: 8 }
      hypervisors: { count: 4 }
      routers: { count: 42 }
      switches: { count: 90 }
      wirelessControllers: { count: 4 }
      firewalls: { count: 42, internetFacing: true }
      databases: { count: 4, criticality: crown_jewel }
      fileServers: { count: 3 }
      internalWebApps: { count: 3 }
      publicWebApps: { count: 1, internetFacing: true, criticality: crown_jewel }
      iotCctvPosDevices: { count: 560, criticality: crown_jewel }
      m365Seats: { count: 600 }
