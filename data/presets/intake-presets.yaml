  - id: manufacturer-two-plants
    name: Manufacturer, 2 plants
    description: Flat OT network, NIS2 in scope, on-premises by preference.
    basis: >-
      Two plants plus a head office. Roughly 450 OT devices per plant: PLCs,
      HMIs, drives, sensors, which is mid-sized for discrete manufacturing.
      520 office PCs across 850 staff, because line workers share terminals.
      Segmentation is the open question this shape always raises, which is why
      the firewall and switch counts matter more here than the endpoint count.
    staffingBasis: >-
      9 IT for 850 staff is one per 94, normal for manufacturing, where most of
      the headcount is on a line and not at a desk. 2 security FTE, not 1: the
      preset also states a business-hours SOC, and one person cannot staff one.
      40 hours of coverage a week is exactly one FTE of desk time before any
      leave, training or incident work, so a single hire means the SOC is dark
      whenever they are away. Two is the floor at which the claim holds. The
      figure remains an analyst estimate, and is well under the IANS
      benchmark.
    profile:
      industry: manufacturing
      region: eu
      employeeCount: 850
      itStaffCount: 9
      securityStaffFte: 2
      hasSoc: business_hours
      riskTolerance: medium
      dataSensitivity: internal
      compliance: [nis2, iso-27001-2022]
      budget:
        annualCap: { amountMinor: 25000000, currency: EUR } # EUR 250,000
        oneTimeCap: null
        currency: EUR
        horizonYears: 3
      environment: on_prem
      procurementBias: no_preference
      retainedTools: []
      excludedProducts: []
