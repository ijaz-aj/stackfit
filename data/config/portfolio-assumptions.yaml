# How bundles are assembled (PROJECT_SPEC §7.4).
#
# Procurement judgement, as opposed to risk judgement — how categories are
# weighted lives in category-weights.yaml.

notes: >-
  Analyst estimates. The suite discount is the one most likely to be wrong for a
  given deal, and it is announced in the rationale wherever it is applied so it
  never silently flatters a single-vendor bundle.

# §7.4 step 5 asks for a "minimum defensible posture" without defining one.
# This is the definition: any category whose weight reaches this floor is in the
# Essential bundle even if no framework demands it.
#
# A weight floor rather than a fixed list, because the weight already accounts
# for the client's infrastructure — so a SaaS-only company's essentials are
# genuinely different from a manufacturer's, instead of both getting the same
# five boxes. On the current weights this selects roughly the top three or four
# categories for a typical estate.
essentialWeightFloor: 85

# §7.4 step 4. Applied to a product's licence when another product from the same
# vendor is already selected.
suiteDiscountRate: 0.1

# Points added to fit score when a product integrates with something already in
# the bundle. Used only to rank value density — never written back into the
# published fit score, which must keep meaning "fit for this client" rather than
# "fit given what we happened to pick first".
suiteIntegrationBonusPoints: 5

# Value density divides by annualised TCO. A zero-cost product would divide by
# zero, so the denominator is floored here — USD 1.00 in minor units. Any
# product this cheap is dominated by its operational cost anyway, which is
# already in the TCO.
minimumAnnualisedCostMinor: 100

# Ranking points for an open-source or open-core product when the client's
# procurementBias is open_source_first.
#
# §7.3 has that bias raise the ops-fit weight, which is honest — the failure
# mode of open source is operational — but on its own it *penalises* open
# source, because operability is where it is weakest. The result was that a
# buyer who asked for open source got commercial recommendations, and §12.3's
# "OSS stack recommended" went unmet.
#
# Set at 8: enough to win a close call, not enough to overturn a product that is
# materially better for this client. A stated preference should tilt a
# recommendation, not dictate it — and the ops-fit weight is still raised, so an
# open-source tool the client cannot operate still loses.
openSourcePreferencePoints: 8

basis: >-
  The 10% suite discount is the low end of what vendors typically concede for a
  second product on the same paper, chosen low deliberately: overstating it
  would bias every bundle towards single-vendor consolidation, which is a
  procurement decision the client should make rather than one the tool should
  quietly make for them. The 5-point integration bonus is likewise small enough
  to break a tie without overturning a materially better product.

# Delivery sequencing for the exported proposal (PROJECT_SPEC §8).
#
# A phase is defined by how much elapsed delivery time it can absorb, not by how
# many products it holds. Nobody deploys thirteen tools at once, and the catalog
# already records how long each one takes to stand up, so the honest sequencing
# question is how much the client can actually absorb by when.
#
# Ordering within the roadmap is mandatory categories first, then by category
# weight — the same priority the portfolio stage already used to spend the
# money, so the plan to deploy matches the plan to buy.
roadmap:
  # The divisor on elapsed time, and the number most worth arguing with: a
  # client with one engineer runs one workstream whatever the plan says. Two is
  # a mid-market IT team running a security project alongside the day job.
  parallelWorkstreams: 2

  phases:
    - label: Immediate
      horizon: First quarter
      elapsedWeeks: 13
      basis: >-
        One quarter. Mandatory controls and the fastest wins, because a
        compliance obligation with a date on it does not wait for a roadmap and
        the tools that deploy in days are how a programme shows progress early.

    - label: Consolidate
      horizon: Months four to nine
      elapsedWeeks: 26
      basis: >-
        Two quarters. The substantial platforms — the ones that need design,
        integration and tuning rather than an installer.

    - label: Extend
      horizon: Month ten onward
      elapsedWeeks: null
      basis: >-
        Open-ended on purpose, so nothing falls off the end of the plan. What
        lands here is genuine improvement rather than remediation, and a client
        who never funds it is not in breach of anything.

  basis: >-
    Analyst judgement. The phase lengths are conventional quarters rather than
    anything derived, and parallelWorkstreams is the assumption that actually
    moves the plan — halve it and the roadmap roughly doubles in length. Both
    are worth confirming against the client's real delivery capacity on the
    call, because a roadmap nobody can staff is a roadmap that slips.

# What the Operable bundle treats as this team's real capacity to run tools.
#
# ⚠ Two things about the figure this constrains on, stated here because they
# decide how much weight the bundle deserves:
#   - every opsBurden in data/catalog is an analyst_estimate — 65 of 65, none
#     vendor-stated and none measured;
#   - FTE is summed across products with no overlap, so a thirteen-tool stack
#     overstates what one team actually carries. Modelling the overlap would
#     mean inventing a coefficient nobody can source.
# That is why operability shapes a fourth bundle rather than constraining the
# Recommended one.
operableCapacity:
  utilisation: 1.0
  basis: >-
    The whole stated team, by default. An analyst who writes "two security
    staff" means two, and discounting that to 1.4 would be StackFit inventing a
    fact about the client's own staffing. Lower it for a team that also carries
    incident response, audit and project work — which is most of them — and the
    Operable bundle shrinks accordingly.
