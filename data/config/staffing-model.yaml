# How many people it takes to run a client's stack.
#
# This file answers the question a client asks in the room and an analyst has to
# be able to defend: "how many of your people are on my account, and how did you
# arrive at that number". Every coefficient carries a basis, and the two that
# are genuinely published carry a source.
#
# TWO DIFFERENT QUESTIONS, kept apart on purpose. Conflating them is the easiest
# way in this whole product to be wrong by an order of magnitude.
#
#   ADMINISTRATION is deploying, tuning, patching, upgrading and maintaining a
#   tool. It scales with the estate. This is what `opsBurden` on each product in
#   data/catalog has always meant, and it is a fraction of an FTE per tool.
#
#   MONITORING is watching what the tools produce, around the clock. It scales
#   with shift coverage, not with the estate, and it is larger than
#   administration by an order of magnitude. On a managed engagement it is the
#   thing we are actually selling.
#
# A client who reads an administration figure as "what it takes to get value
# from a SIEM" has been misled. One who reads it as "what it takes to keep the
# SIEM running" has not. Both figures are shown, labelled, separately.

asOf: '2026-09-13'

sources:
  - url: https://securityoperationscost.com/soc-staffing-cost
    asOf: '2026-09-13'
  - url: https://expel.com/cyberspeak/cost-to-build-and-operate-a-24x7-soc/
    asOf: '2026-09-13'
  - url: https://threatdefence.com/article/managed-soc-providers-what-to-look-for-and-how-to-compare-them
    asOf: '2026-09-13'
  - url: https://radiantsecurity.ai/blog/scaling-security-operations-a-practical-guide/
    asOf: '2026-09-13'

administration:
  # ⚠ THE LEAST GROUNDED NUMBER IN THIS FILE, and it is worth being plain about
  # why: no publisher quotes a "FTE per 1,000 endpoints to administer a SIEM"
  # ratio. It was searched for and it does not exist. What *is* published, and
  # consistently, is that administration effort does not scale linearly:
  # automation, centralised policy and template inheritance mean the
  # ten-thousandth endpoint costs far less to bring under management than the
  # hundredth.
  #
  # So the exponent is a shape taken from published practice, with its magnitude
  # chosen by the analyst. 0.75 is the standard sublinear exponent used in
  # capacity and effort estimation when the direction is known and the
  # coefficient is not. Its effect, on the Elastic Security SIEM coefficients
  # (0.5 base + 0.3 per 1,000):
  #
  #      assets     linear (old)     0.75 (now)
  #         100          0.53           0.55
  #       1,000          0.80           0.80      <- unchanged at the reference
  #       5,000          2.00           1.51
  #      10,000          3.50           2.19
  #      50,000         15.50           6.14
  #
  # The old model asked for 15.5 people to administer one SIEM, which is not a
  # number anybody could take to a client. Note it moves *up* slightly below the
  # reference: a small estate does not get proportionally cheaper to administer,
  # because a floor of irreducible work exists whatever the size.
  scaleExponent: 0.75
  referenceAssets: 1000
  basis: >-
    Sublinear shape is published practice; the 0.75 magnitude is an analyst
    choice, being the conventional exponent where the direction is established
    and the coefficient is not. Anchored so that a 1,000-asset estate is
    unchanged from the linear model that preceded it, which keeps every
    coefficient in data/catalog meaning what its author intended.

  # The same product is not the same job depending on who hosts it, and until
  # now the engine charged the same effort either way. A vendor-hosted tenancy
  # has no patching, no capacity planning, no upgrade window and no backup of
  # the tool itself. An air-gapped deployment has all of that plus manual
  # content, signature and threat-intelligence updates.
  #
  # These multiply the administration figure only. They do not touch monitoring:
  # who hosts the console does not change how many alerts arrive at 3am.
  byDeploymentMode:
    - mode: cloud
      multiplier: 0.6
      basis: >-
        No patching, capacity planning, upgrades or backup of the tool itself;
        the vendor carries all four. What remains is genuine and is why this is
        not lower: policy, tuning, integrations, access review and the alert
        content still belong to whoever operates it.
    - mode: hybrid
      multiplier: 0.85
      basis: >-
        A managed control plane with self-hosted collectors, gateways or
        sensors. Most of the platform burden goes; the field components, their
        upgrades and their failure modes stay.
    - mode: on_prem
      multiplier: 1.0
      basis: >-
        The baseline every `opsBurden` figure in data/catalog was written
        against. Changing this number silently reinterprets all 65 of them.
    - mode: air_gapped
      multiplier: 1.25
      basis: >-
        Everything on-premises requires, plus manual content, signature and
        threat-intelligence updates, out-of-band patching, and a change process
        that assumes no route to the internet. The uplift is deliberately modest
        because the underlying tool is the same; it is the handling that differs.

monitoring:
  # Unlike administration, this is arithmetic over published figures, and it is
  # the part of the answer a client is entitled to see worked out.
  #
  #   8,760 hours of continuous coverage in a year
  #   ------------------------------------------- = 4.87 FTE to keep ONE seat
  #   1,800 productive hours per FTE per year        staffed around the clock
  #
  # That 4.87 is why a 24/7 rota cannot be staffed by three people, and it is
  # the figure behind the widely reported 8-12 headcount for a minimum viable
  # in-house 24/7 SOC (5-6 tier 1, 2-3 tier 2, a tier 3, a manager).
  #
  # An MSSP does not sell that seat to one client. Published guidance puts
  # genuine 24/7 coverage at roughly one analyst seat per 50 to 100 small
  # customers, degrading into alert backlog above that. 75 is the midpoint.
  #
  # So a reference-sized client consumes 4.87 / 75 = 0.065 FTE of real
  # headcount. Larger clients consume more, sublinearly.
  hoursPerYearOfCoverage: 8760
  productiveHoursPerFteYear: 1800
  referenceClientsPerSeat: 75
  referenceMonitoredAssets: 250
  scaleExponent: 0.7
  basis: >-
    8,760 over 1,800 productive hours is arithmetic, and 1,800 is the standard
    productive-hours assumption after leave, training and sickness. The 50-100
    clients per seat range is published MSSP guidance and 75 is its midpoint;
    250 monitored assets is the analyst reading of what that guidance calls a
    "small customer", and is the weakest number here. The 0.7 exponent is an
    analyst choice on the same reasoning as the administration one: a client ten
    times the size generates more triage, but not ten times more once tuning and
    suppression have been done. ⚠ Replace referenceClientsPerSeat and
    referenceMonitoredAssets with figures from our own rota and client book, which
    is the one place the real numbers exist.
