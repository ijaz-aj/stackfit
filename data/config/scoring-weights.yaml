# Fit scoring weights (PROJECT_SPEC §7.3).
#
# These encode a point of view, not a fact: how much worse is a tool nobody can
# run than a tool that covers 10% less of the estate? That is an argument to
# have with an analyst, so it lives here rather than in a scoring function.
#
# The seven dimensions and their default weights are exactly §7.3's table. What
# the spec leaves open, and this file decides:
#
#   - `categoryRemits`. Asset coverage is measured against what a category is
#     *supposed* to cover, not against the whole estate. An email gateway
#     covers mailboxes; scored against every asset the client owns it would
#     look permanently terrible, and §7.4 step 2 compares fit scores across
#     categories when it ranks value density. Against its remit, a gateway
#     covering every mailbox scores 100. The honest answer.
#
#   - `opsFit`. §7.3 says "penalise when required FTE > available FTE" without
#     saying how hard. The curve is below, and the zero-staff case is called out
#     explicitly because it is common and would otherwise divide by zero.

notes: >-
  Dimension weights are PROJECT_SPEC §7.3's table unchanged. The ops-fit curve,
  the category remits and the bias deltas are analyst judgement. Tune the
  ops-fit curve first if open-source options look too good or too bad.

dimensions:
  - dimension: asset_coverage
    weight: 25
    basis: >-
      §7.3. The largest single weight, because a product that does not reach an
      asset does nothing for it, however good it is.
  - dimension: compliance_fit
    weight: 20
    basis: §7.3. Only bites when the analyst has ticked frameworks; otherwise it is neutral for everyone.
  - dimension: ops_fit
    weight: 20
    basis: >-
      §7.3, and the reason this tool exists. A powerful tool nobody can run
      scores badly, which is what stops "free" from winning by default.
  - dimension: deployment_fit
    weight: 10
    basis: §7.3.
  - dimension: integration_fit
    weight: 10
    basis: §7.3. Rewards fitting what the client already owns and is keeping.
  - dimension: scale_fit
    weight: 10
    basis: §7.3. Being inside the supported band is a hard filter; this scores how centred they are in it.
  - dimension: maturity
    weight: 5
    basis: Deliberately the smallest weight, because maturity is a tie-breaker rather than a reason.

# procurementBias shifts the weights, then everything is renormalised to 100.
biasAdjustments:
  - bias: open_source_first
    deltas:
      - dimension: ops_fit
        delta: 10
        basis: >-
          §7.3 names this case: the failure mode of open source is operational,
          not financial, so someone leaning that way needs the operability
          question weighted harder, not softer.
      - dimension: maturity
        delta: -3
        basis: A newer open-source project is a normal thing to accept when that is the stated preference.
  - bias: commercial
    deltas:
      - dimension: maturity
        delta: 4
        basis: A buyer who has ruled out open source is usually buying support and longevity.
      - dimension: integration_fit
        delta: 3
        basis: Commercial buyers tend to be consolidating on a suite, where fitting the estate matters more.
  - bias: no_preference
    deltas: []

# hasSoc shifts them too, and is summed with the bias above before
# renormalising. The two answer different questions: how this client likes to
# buy, and whether anybody is watching the tools once bought.
#
# This field was captured at intake, stored, shown in the compare diff and read
# by nothing at all. A client with a 24/7 SOC and a client with nobody watching
# got byte-identical recommendations, which is the oldest failure in security
# procurement written into the engine: a SIEM is a machine for producing
# alerts, and alerts nobody is rostered to triage are shelfware with a licence
# fee attached. Practitioner guidance on SIEM selection starts from how many
# analysts are available to write detections, triage and hunt.
#
# It moves ops_fit and nothing else. Monitoring capability is exactly the
# question ops_fit exists to ask, and the alternative, eliminating heavy tools
# for understaffed clients, would be StackFit deciding instead of advising. A
# client with no SOC can legitimately buy a SIEM. They should not buy the one
# that needs a team.
#
# The sizes are an analyst judgement, stated rather than derived: ops_fit is 20
# by default, so +12 makes it the joint-largest dimension for a client with
# nobody watching, and -5 leaves it material but no longer decisive for one
# whose provider carries the load.
socAdjustments:
  - soc: none
    deltas:
      - dimension: ops_fit
        delta: 12
        basis: >-
          Nobody is rostered to look at anything this stack produces. The
          largest adjustment in this file, because it is the case where a tool
          that needs attention is not a worse buy but a wasted one. Note the
          Operable bundle and the managed alternative already say this in
          prose; this is the same finding reaching the ranking.
  - soc: business_hours
    deltas:
      - dimension: ops_fit
        delta: 5
        basis: >-
          Somebody is watching for a third of the week. Enough that a tool
          demanding daily attention is viable, not enough that one demanding
          constant attention is.
  - soc: 24x7
    deltas:
      - dimension: ops_fit
        delta: -3
        basis: >-
          A round-the-clock rota is the one case where operability constrains
          the choice least, so the other dimensions get their weight back.
          Small, not large: 24/7 cover is a rota, not spare capacity, and the
          FTE arithmetic in opsFit still applies.
  - soc: outsourced
    deltas:
      - dimension: ops_fit
        delta: -5
        basis: >-
          The provider carries the operational load, which is what the client
          is paying them for. Still negative rather than zero, because the tool
          has to be one the provider can actually consume, and StackFit does
          not model any particular provider's toolchain.

opsFit:
  comfortableShareOfFte: 0.35
  unusableShareOfFte: 1.2
  scoreWithNoSecurityStaff: 15
  unusableFteWithNoSecurityStaff: 0.5
  basis: >-
    One product may take about a third of the security team before its score
    starts to fall, and is scored zero once it would need more than the whole
    team: at 1.2 FTE against 1.0 available, nothing else gets run. The
    zero-staff score is low but not zero: a client with no security staff can
    still buy something, it just cannot be something they operate, and the MDR
    alternative in §7.4 step 6 is the honest answer for them.

    unusableFteWithNoSecurityStaff is the half-FTE mark. A client with no
    security team still has IT staff, and they can absorb a tool that needs a
    few hours a week; they cannot absorb one that needs half a person. Below
    that figure the score falls linearly from 100, so a managed service needing
    0.1 FTE scores around 80 and a self-hosted SIEM needing 0.6 sits on the
    floor. Tune this first if managed options look too strong or too weak for
    the zero-staff case. It is the single number that decides PROJECT_SPEC
    §12.2.

maturityScores:
  established: 100
  emerging: 60
  legacy: 30

# Which device class each asset class is. A definition, not an estimate.
assetClassDeviceClass:
  windowsEndpoints: workstation
  macosEndpoints: workstation
  linuxEndpoints: workstation
  windowsServers: server
  windowsDomainControllers: domain_controller
  linuxServers: server
  hypervisors: hypervisor
  containerNodes: container_node
  routers: network_device
  switches: network_device
  wirelessControllers: network_device
  firewalls: firewall
  vpnConcentrators: network_device
  loadBalancers: network_device
  databases: database
  fileServers: server
  internalWebApps: web_app
  publicWebApps: web_app
  otIcsScadaDevices: ot_ics
  iotCctvPosDevices: iot
  awsAccounts: cloud_workload
  azureSubscriptions: cloud_workload
  gcpProjects: cloud_workload
  cloudWorkloads: cloud_workload
  m365Seats: mailbox
  googleWorkspaceSeats: mailbox
  otherCriticalSaasApps: saas_tenant
  remoteUsers: identity
  privilegedAccounts: identity
  serviceAccounts: identity

# What each category is meant to reach. Asset coverage is scored against this,
# never against the whole estate.
categoryRemits:
  - category: siem
    deviceClasses:
      [server, workstation, domain_controller, hypervisor, container_node, network_device,
       firewall, database, web_app, cloud_workload, saas_tenant, ot_ics, iot, identity, mailbox]
    basis: >-
      A SIEM ingests from everything, and is the one category whose remit really
      is the whole estate. Anything it cannot take a log from is a genuine gap.
  - category: edr
    deviceClasses: [workstation, server, domain_controller, hypervisor, container_node]
    basis: Anything that can run an agent. Deliberately excludes network gear, OT and SaaS, which cannot.
  - category: ndr
    deviceClasses: [network_device, firewall, server, ot_ics, iot, cloud_workload]
    basis: >-
      Everything that puts traffic on a wire, including the unmanaged devices
      that are the reason to buy it. Not workstations. They are better served
      by an agent.
  - category: pam
    deviceClasses: [identity, domain_controller, server, cloud_workload, database]
    basis: Privileged accounts and the systems they are privileged on.
  - category: iam
    deviceClasses: [identity, saas_tenant, cloud_workload, mailbox]
    basis: Human and machine identities, and the tenancies that authenticate them.
  - category: vulnerability_management
    deviceClasses:
      [server, workstation, domain_controller, hypervisor, container_node, network_device,
       firewall, database, web_app, cloud_workload, ot_ics, iot]
    basis: Anything with software on it that can carry a CVE. Excludes identity and SaaS tenancies, which do not patch.
  - category: email_security
    deviceClasses: [mailbox]
    basis: >-
      Mailboxes, and nothing else. The clearest case for scoring against a remit
      rather than the estate.
  - category: soar
    deviceClasses:
      [server, workstation, domain_controller, network_device, firewall, cloud_workload,
       saas_tenant, identity, mailbox]
    basis: Whatever it has an API to act against. Not OT, where automated response is a safety decision.
  - category: backup
    deviceClasses: [server, domain_controller, hypervisor, database, workstation, cloud_workload, saas_tenant]
    basis: Anything holding state worth restoring.
  - category: ngfw
    deviceClasses: [network_device, firewall, server, web_app, ot_ics]
    basis: What sits behind or within the perimeter it enforces.
  - category: asset_discovery
    deviceClasses:
      [server, workstation, domain_controller, hypervisor, container_node, network_device,
       firewall, database, web_app, cloud_workload, saas_tenant, ot_ics, iot]
    basis: Everything findable. Excludes identity, which is an inventory question a directory already answers.
  - category: deception
    deviceClasses: [server, domain_controller, network_device, ot_ics, identity]
    basis: Where a decoy is plausible and any interaction with it is unambiguously hostile.
  - category: mdr
    deviceClasses:
      [workstation, server, domain_controller, hypervisor, container_node, network_device,
       firewall, cloud_workload, saas_tenant, identity, mailbox, ot_ics]
    basis: >-
      Follows the telemetry the provider is given, so its remit is close to a
      SIEM's. OT is included but most providers cover it thinly. See the
      category-weights.yaml affinity.

# How deployment fit is scored (§7.3).
#
# `deploymentPreference: hybrid` is how this tool spells "no strong preference"
#. It is the wording the wizard uses, so it is not scored as a demand for a
# hybrid product. It is scored against the estate the client actually runs.
#
# Before this block existed, a client with no preference scored every cloud-only
# and every on-prem-only product 30 out of 100, as though they had insisted on
# hybrid. That penalised exactly the products that suited their estate best.
deploymentFit:
  # A stated preference is a requirement the analyst heard from the client.
  statedMatch: 100
  statedHybridFallback: 70
  statedMismatch: 30

  # The client runs both, and this product offers one of the two. It serves the
  # half it targets natively and the other half through a longer path: real
  # fit, not the whole answer. A hybrid-capable product still scores 100.
  statedSingleModeInHybrid: 85

  # An inferred preference is StackFit's own reading of the asset counts. It is
  # a weaker claim, so it tilts the ranking rather than deciding it: the gap
  # between a match and a mismatch is 45 points here against 70 above.
  inferredMatch: 100
  inferredHybridFallback: 85
  inferredMismatch: 55

  # Nothing stated, nothing inferable. Every product scores alike rather than
  # being marked down for a question nobody asked.
  noSignal: 85

  byEstateShape:
    - shape: on_prem_centric
      prefers: [on_prem]
      basis: >-
        Servers, network and endpoints the client operates themselves. A tool
        that cannot be run inside their own estate means new egress, new
        accounts and a new trust boundary for data they currently hold.
    - shape: ot_heavy
      prefers: [on_prem, air_gapped]
      basis: >-
        Plant networks are segmented from the internet more often than not, and
        the sensible default for anything watching them is that it stays inside
        the segment. Air-gap capability is an advantage here, not an oddity.
    - shape: saas_centric
      prefers: [cloud]
      basis: >-
        Work happens in someone else's SaaS and there is no server room to put
        an appliance in. Recommending a self-hosted tool to this client means
        recommending they build the infrastructure to host it first.
    - shape: cloud_native
      prefers: [cloud]
      basis: >-
        Owned workloads, but in public cloud. A SaaS or cloud-delivered tool
        sits where the workloads already are; an on-prem appliance means
        back-hauling telemetry out of the accounts that generate it.
    - shape: hybrid
      prefers: [hybrid, cloud, on_prem]
      basis: >-
        Material weight in both owned infrastructure and cloud. Anything
        deployable either way genuinely fits, which is the one case where a
        hybrid-capable product is the right answer rather than a compromise.
    - shape: unknown
      prefers: []
      basis: >-
        No inventory captured, so nothing can be inferred. Scored neutral for
        every product: an absent answer is not evidence against anything.

  basis: >-
    The stated bands are unchanged from the original §7.3 implementation. The
    inferred bands are deliberately compressed around neutral: 55 to 100
    against 30 to 100, because the tool is reading asset counts rather than
    repeating something the client said, and a guess should move a ranking
    without overturning it.
